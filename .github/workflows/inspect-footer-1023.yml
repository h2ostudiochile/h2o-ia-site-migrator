name: Inspect 1.0.23 footer source
on:
  push:
    branches:
      - fix/global-footer-funnel-1.0.24
    paths:
      - '.github/workflows/inspect-footer-1023.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/h2osm1023"
          mkdir -p "$WORK"
          cat bootstrap/1.0.23/part-*.b64 | tr -d '\n\r ' | base64 --decode > "$WORK/pkg.zip"
          unzip -q "$WORK/pkg.zip" -d "$WORK/pkg"
          ROOT="$WORK/pkg/h2o-ia-site-migrator"
          echo "=== profile head ==="
          nl -ba "$ROOT/profiles/templa-design.php" | sed -n '1,90p'
          echo "=== footer phrase refs ==="
          grep -Rni -C 8 -E "Tu próximo espacio|Conversemos|conversemos|proximo espacio|próximo espacio" "$ROOT" || true
          echo "=== funnels ==="
          nl -ba "$ROOT/includes/class-funnels.php" | sed -n '1,420p'
          echo "=== sync ==="
          nl -ba "$ROOT/includes/class-sync.php" | sed -n '1,320p'
          echo "=== plugin ==="
          nl -ba "$ROOT/includes/class-plugin.php" | sed -n '1,260p'
