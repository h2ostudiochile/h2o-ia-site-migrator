name: Release h2o IA Site Migrator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'bootstrap/trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h2o-ia-site-migrator-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build 1.0.5 layout hotfix
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="1.0.4"
          VERSION="1.0.5"
          BASE_SHA="7ba7b1f0a070aa193c709b3b37387b7aa7d35055484a31e47b9529c3288e17d1"
          WORK="$RUNNER_TEMP/h2osm-$VERSION"
          DIST="$GITHUB_WORKSPACE/dist"

          rm -rf "$WORK" "$DIST"
          mkdir -p "$WORK" "$DIST"

          cat bootstrap/$BASE_VERSION/part-*.b64 | tr -d '\n\r ' | base64 --decode > "$WORK/base.zip"
          test "$(sha256sum "$WORK/base.zip" | awk '{print $1}')" = "$BASE_SHA"
          unzip -q "$WORK/base.zip" -d "$WORK/src"

          ROOT="$WORK/src/h2o-ia-site-migrator"
          sed -i "s/Version: $BASE_VERSION/Version: $VERSION/" "$ROOT/h2o-ia-site-migrator.php"
          sed -i "s/define( 'H2OSM_VERSION', '$BASE_VERSION' )/define( 'H2OSM_VERSION', '$VERSION' )/" "$ROOT/h2o-ia-site-migrator.php"
          sed -i "s/h2o-site-migrator:templa-design:$BASE_VERSION/h2o-site-migrator:templa-design:$VERSION/g" "$ROOT/profiles/templa-design.php"
          sed -i "s/data-h2osm-release=\"$BASE_VERSION\"/data-h2osm-release=\"$VERSION\"/g" "$ROOT/profiles/templa-design.php"
          sed -i 's/15 \* MINUTE_IN_SECONDS/2 * MINUTE_IN_SECONDS/g' "$ROOT/includes/class-updater.php" || true

          cat >> "$ROOT/assets/frontend.css" <<'CSS'
          
          /* 1.0.5 — restore canonical Salient row geometry.
             Visual rows: full width content.
             Editorial rows: full width background, centered content container. */
          .h2osm-managed-page .h2osm-site>.h2osm-hero-row,
          .h2osm-managed-page .h2osm-site>.h2osm-visual-row,
          .h2osm-managed-page .h2osm-site>.h2osm-video-row,
          .h2osm-managed-page .h2osm-site>.h2osm-fullbleed{
            width:100vw!important;
            max-width:none!important;
            margin-left:calc(50% - 50vw)!important;
            margin-right:calc(50% - 50vw)!important;
            padding-left:0!important;
            padding-right:0!important;
          }
          .h2osm-managed-page .h2osm-hero,
          .h2osm-managed-page .h2osm-subhero,
          .h2osm-managed-page .h2osm-video{
            width:100vw!important;
            max-width:none!important;
            margin-left:calc(50% - 50vw)!important;
            margin-right:calc(50% - 50vw)!important;
          }
          .h2osm-managed-page .h2osm-site>.h2osm-section,
          .h2osm-managed-page .h2osm-site>.h2osm-service-grid,
          .h2osm-managed-page .h2osm-site>.h2osm-project-grid,
          .h2osm-managed-page .h2osm-site>.h2osm-salient-blog-row,
          .h2osm-managed-page .h2osm-site>.h2osm-value-grid,
          .h2osm-managed-page .h2osm-site>.h2osm-service-detail-grid,
          .h2osm-managed-page .h2osm-site>.h2osm-project-categories,
          .h2osm-managed-page .h2osm-site>.h2osm-before-after,
          .h2osm-managed-page .h2osm-site>.h2osm-page-title,
          .h2osm-managed-page .h2osm-site>.h2osm-contact-hero,
          .h2osm-managed-page .h2osm-site>.h2osm-contact-grid{
            width:100vw!important;
            max-width:none!important;
            margin-left:calc(50% - 50vw)!important;
            margin-right:calc(50% - 50vw)!important;
            padding-left:0!important;
            padding-right:0!important;
          }
          .h2osm-managed-page .h2osm-site>.h2osm-section>.row_col_wrap_12,
          .h2osm-managed-page .h2osm-site>.h2osm-service-grid>.row_col_wrap_12,
          .h2osm-managed-page .h2osm-site>.h2osm-project-grid>.row_col_wrap_12,
          .h2osm-managed-page .h2osm-site>.h2osm-salient-blog-row>.row_col_wrap_12,
          .h2osm-managed-page .h2osm-site>.h2osm-value-grid>.row_col_wrap_12,
          .h2osm-managed-page .h2osm-site>.h2osm-service-detail-grid>.row_col_wrap_12,
          .h2osm-managed-page .h2osm-site>.h2osm-project-categories>.row_col_wrap_12,
          .h2osm-managed-page .h2osm-site>.h2osm-before-after>.row_col_wrap_12,
          .h2osm-managed-page .h2osm-site>.h2osm-page-title>.row_col_wrap_12,
          .h2osm-managed-page .h2osm-site>.h2osm-contact-hero>.row_col_wrap_12,
          .h2osm-managed-page .h2osm-site>.h2osm-contact-grid>.row_col_wrap_12{
            width:100%!important;
            max-width:var(--h2osm-max)!important;
            margin-left:auto!important;
            margin-right:auto!important;
            padding-left:32px!important;
            padding-right:32px!important;
          }
          .h2osm-managed-page .h2osm-site>.h2osm-service-grid>.row_col_wrap_12,
          .h2osm-managed-page .h2osm-site>.h2osm-project-grid>.row_col_wrap_12,
          .h2osm-managed-page .h2osm-site>.h2osm-value-grid>.row_col_wrap_12,
          .h2osm-managed-page .h2osm-site>.h2osm-service-detail-grid>.row_col_wrap_12,
          .h2osm-managed-page .h2osm-site>.h2osm-project-categories>.row_col_wrap_12,
          .h2osm-managed-page .h2osm-site>.h2osm-before-after>.row_col_wrap_12,
          .h2osm-managed-page .h2osm-site>.h2osm-contact-grid>.row_col_wrap_12{
            display:flex!important;
            flex-wrap:wrap!important;
          }
          .h2osm-managed-page .h2osm-site>.h2osm-section.h2osm-section-dark,
          .h2osm-managed-page .h2osm-site>.h2osm-service-grid.h2osm-section-dark{
            background:var(--h2osm-black)!important;
          }
          .h2osm-managed-page .h2osm-site>.h2osm-section.h2osm-section-cream,
          .h2osm-managed-page .h2osm-site>.h2osm-value-grid.h2osm-section-cream{
            background:var(--h2osm-cream)!important;
          }
          @media(max-width:760px){
            .h2osm-managed-page .h2osm-site>.h2osm-section>.row_col_wrap_12,
            .h2osm-managed-page .h2osm-site>.h2osm-service-grid>.row_col_wrap_12,
            .h2osm-managed-page .h2osm-site>.h2osm-project-grid>.row_col_wrap_12,
            .h2osm-managed-page .h2osm-site>.h2osm-salient-blog-row>.row_col_wrap_12,
            .h2osm-managed-page .h2osm-site>.h2osm-value-grid>.row_col_wrap_12,
            .h2osm-managed-page .h2osm-site>.h2osm-service-detail-grid>.row_col_wrap_12,
            .h2osm-managed-page .h2osm-site>.h2osm-project-categories>.row_col_wrap_12,
            .h2osm-managed-page .h2osm-site>.h2osm-before-after>.row_col_wrap_12,
            .h2osm-managed-page .h2osm-site>.h2osm-page-title>.row_col_wrap_12,
            .h2osm-managed-page .h2osm-site>.h2osm-contact-hero>.row_col_wrap_12,
            .h2osm-managed-page .h2osm-site>.h2osm-contact-grid>.row_col_wrap_12{
              padding-left:18px!important;
              padding-right:18px!important;
            }
          }
          CSS

          {
            echo "## $VERSION — 2026-10-05"
            echo "- Hotfix de geometría: restaura full width content exclusivamente para hero/imagen/video."
            echo "- Restaura full width background con contenido centrado para filas editoriales y texto + imagen."
            echo "- Conserva Nectar Post Grid con imágenes destacadas en Blog."
            echo
            cat "$ROOT/CHANGELOG.md"
          } > "$WORK/CHANGELOG.md"
          mv "$WORK/CHANGELOG.md" "$ROOT/CHANGELOG.md"

          php -l "$ROOT/h2o-ia-site-migrator.php" >/dev/null
          php -l "$ROOT/profiles/templa-design.php" >/dev/null
          grep -q "Version: $VERSION" "$ROOT/h2o-ia-site-migrator.php"
          grep -q "h2o-site-migrator:templa-design:$VERSION" "$ROOT/profiles/templa-design.php"
          grep -q "nectar_post_grid" "$ROOT/profiles/templa-design.php"
          grep -q "restore canonical Salient row geometry" "$ROOT/assets/frontend.css"

          (cd "$WORK/src" && zip -qr "$DIST/h2o-ia-site-migrator-$VERSION.zip" h2o-ia-site-migrator)
          SHA="$(sha256sum "$DIST/h2o-ia-site-migrator-$VERSION.zip" | awk '{print $1}')"
          echo "$SHA" > "$DIST/package.sha256"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_SHA256=$SHA" >> "$GITHUB_ENV"

          base64 -w0 "$DIST/h2o-ia-site-migrator-$VERSION.zip" > "$DIST/package.b64"
          mkdir -p "$DIST/parts"
          split -b 5000 -d -a 2 "$DIST/package.b64" "$DIST/parts/part-"

          node - "$VERSION" "$SHA" <<'NODE'
                    const fs = require('fs');
                    const [version, sha] = process.argv.slice(2);
                    const files = fs.readdirSync('dist/parts').sort();
                    const parts = files.map((f,i) => 'https://raw.githubusercontent.com/h2ostudiochile/h2o-ia-site-migrator/main/bootstrap/' + version + '/part-' + String(i+1).padStart(2,'0') + '.b64');
                    const manifest = {
                      version,
                      package_id: 'https://raw.githubusercontent.com/h2ostudiochile/h2o-ia-site-migrator/main/bootstrap/package.sha256',
                      package_sha256: sha,
                      parts,
                      tested: '7.1',
                      requires_php: '8.0'
                    };
                    fs.writeFileSync('dist/release-bootstrap.json', JSON.stringify(manifest, null, 2) + '\n');
                    fs.writeFileSync('dist/release.json', JSON.stringify({
                      version,
                      package_url: 'https://github.com/h2ostudiochile/h2o-ia-site-migrator/releases/download/v' + version + '/h2o-ia-site-migrator-' + version + '.zip',
                      package_sha256: sha,
                      tested: '7.1',
                      requires_php: '8.0'
                    }, null, 2) + '\n');
          NODE

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          PACKAGE="dist/h2o-ia-site-migrator-$VERSION.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" dist/release.json --clobber
          else
            gh release create "$TAG" "$PACKAGE" dist/release.json \
              --target main \
              --title "h2o IA Site Migrator $VERSION" \
              --notes "Hotfix: full width content sólo para visuales; full width background con contenido centrado para filas editoriales. Conserva Nectar Post Grid del Blog."
          fi

      - name: Publish updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"

          put_file () {
            path="$1"
            file="$2"
            msg="$3"
            encoded="$(base64 -w0 "$file")"
            sha="$(gh api "repos/$REPO/contents/$path?ref=main" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              gh api --method PUT "repos/$REPO/contents/$path" \
                -f message="$msg" -f content="$encoded" -f sha="$sha" -f branch="main" >/dev/null
            else
              gh api --method PUT "repos/$REPO/contents/$path" \
                -f message="$msg" -f content="$encoded" -f branch="main" >/dev/null
            fi
          }

          i=1
          for f in dist/parts/part-*; do
            target="$(printf 'bootstrap/%s/part-%02d.b64' "$VERSION" "$i")"
            put_file "$target" "$f" "Site Migrator $VERSION package part $i"
            i=$((i+1))
          done

          put_file "bootstrap/package.sha256" "dist/package.sha256" "Site Migrator $VERSION checksum"
          put_file "bootstrap/release.json" "dist/release-bootstrap.json" "Publish Site Migrator $VERSION updater manifest"
