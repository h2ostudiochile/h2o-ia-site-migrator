name: Release h2o IA Site Migrator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'bootstrap/trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h2o-ia-site-migrator-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build 1.0.8 native Salient structure fix
        shell: bash
        run: |
          set -euo pipefail

          BASE_VERSION="1.0.7"
          VERSION="1.0.8"
          WORK="$RUNNER_TEMP/h2osm-$VERSION"
          DIST="$GITHUB_WORKSPACE/dist"

          rm -rf "$WORK" "$DIST"
          mkdir -p "$WORK/current" "$WORK/good" "$DIST/parts"

          # Current plugin.
          cat bootstrap/$BASE_VERSION/part-*.b64 | tr -d '\n\r ' | base64 --decode > "$WORK/current.zip"
          unzip -q "$WORK/current.zip" -d "$WORK/current"
          ROOT="$WORK/current/h2o-ia-site-migrator"

          # Restore pre-1.0.7 CSS baseline. Native Salient will own row/container geometry.
          cat bootstrap/1.0.6/part-*.b64 | tr -d '\n\r ' | base64 --decode > "$WORK/good.zip"
          unzip -q "$WORK/good.zip" -d "$WORK/good"
          cp "$WORK/good/h2o-ia-site-migrator/assets/frontend.css" "$ROOT/assets/frontend.css"

          python3 - "$ROOT" "$BASE_VERSION" "$VERSION" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          base = sys.argv[2]
          version = sys.argv[3]

          # 1) Stop replacing Salient's page template.
          plugin = root / "includes/class-plugin.php"
          s = plugin.read_text()
          s = re.sub(r"\n\s*add_filter\(\s*'template_include'.*?\);", "", s, count=1)
          plugin.write_text(s)

          # 2) Body content only: header/navigation/footer belong to Salient global architecture.
          profile = root / "profiles/templa-design.php"
          p = profile.read_text()

          p = re.sub(
              r"\$nav\s*=\s*static function \(\) use \( \$logo \): string \{.*?\n\};",
              "\$nav = static function (): string { return ''; };",
              p, count=1, flags=re.S
          )
          p = re.sub(
              r"\$footer\s*=\s*static function \(\): string \{.*?\n\};",
              "\$footer = static function (): string { return ''; };",
              p, count=1, flags=re.S
          )

          # Version/sync markers.
          p = p.replace(f"h2o-site-migrator:templa-design:{base}", f"h2o-site-migrator:templa-design:{version}")
          p = p.replace(f'data-h2osm-release="{base}"', f'data-h2osm-release="{version}"')
          profile.write_text(p)

          # Main plugin version.
          main = root / "h2o-ia-site-migrator.php"
          m = main.read_text()
          m = m.replace(f"Version: {base}", f"Version: {version}")
          m = m.replace(f"define( 'H2OSM_VERSION', '{base}' )", f"define( 'H2OSM_VERSION', '{version}' )")
          main.write_text(m)
          PY

          {
            echo "## $VERSION — 2026-10-05"
            echo "- Devuelve el render completo al template nativo de Salient."
            echo "- Elimina header/logo/menu embebidos dentro del contenido de cada página."
            echo "- Elimina footer embebido; el footer vuelve a depender de la configuración global/Global Section de Salient."
            echo "- El Site Migrator administra únicamente el cuerpo de cada página."
            echo "- Restaura la geometría CSS previa y deja Header, Footer y containers a cargo de Salient."
            echo
            cat "$ROOT/CHANGELOG.md"
          } > "$WORK/CHANGELOG.md"
          mv "$WORK/CHANGELOG.md" "$ROOT/CHANGELOG.md"

          # Structural guard rails.
          php -l "$ROOT/h2o-ia-site-migrator.php" >/dev/null
          php -l "$ROOT/includes/class-plugin.php" >/dev/null
          php -l "$ROOT/profiles/templa-design.php" >/dev/null
          grep -q "Version: $VERSION" "$ROOT/h2o-ia-site-migrator.php"
          ! grep -q "add_filter( 'template_include'" "$ROOT/includes/class-plugin.php"
          grep -q "\$nav = static function (): string { return ''; };" "$ROOT/profiles/templa-design.php"
          grep -q "\$footer = static function (): string { return ''; };" "$ROOT/profiles/templa-design.php"
          grep -q 'type="full_width_content" full_width="stretch_row_content_no_spaces"' "$ROOT/profiles/templa-design.php"
          grep -q 'type="full_width_background" el_class="h2osm-section"' "$ROOT/profiles/templa-design.php"
          grep -q 'nectar_post_grid' "$ROOT/profiles/templa-design.php"
          ! grep -q 'margin-left:calc(50% - 50vw)' "$ROOT/assets/frontend.css"

          (cd "$WORK/current" && zip -qr "$DIST/h2o-ia-site-migrator-$VERSION.zip" h2o-ia-site-migrator)
          SHA="$(sha256sum "$DIST/h2o-ia-site-migrator-$VERSION.zip" | awk '{print $1}')"
          echo "$SHA" > "$DIST/package.sha256"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_SHA256=$SHA" >> "$GITHUB_ENV"

          base64 -w0 "$DIST/h2o-ia-site-migrator-$VERSION.zip" > "$DIST/package.b64"
          split -b 5000 -d -a 2 "$DIST/package.b64" "$DIST/parts/raw-"

          node - "$VERSION" "$SHA" <<'NODE'
          const fs = require('fs');
          const [version, sha] = process.argv.slice(2);
          const raw = fs.readdirSync('dist/parts').sort();
          const parts = raw.map((f,i) =>
            'https://raw.githubusercontent.com/h2ostudiochile/h2o-ia-site-migrator/main/bootstrap/' +
            version + '/part-' + String(i + 1).padStart(2,'0') + '.b64'
          );
          fs.writeFileSync('dist/release-bootstrap.json', JSON.stringify({
            version,
            package_id: 'https://raw.githubusercontent.com/h2ostudiochile/h2o-ia-site-migrator/main/bootstrap/package.sha256',
            package_sha256: sha,
            parts,
            tested: '7.1',
            requires_php: '8.0'
          }, null, 2) + '\n');
          fs.writeFileSync('dist/release.json', JSON.stringify({
            version,
            package_url: 'https://github.com/h2ostudiochile/h2o-ia-site-migrator/releases/download/v' + version + '/h2o-ia-site-migrator-' + version + '.zip',
            package_sha256: sha,
            tested: '7.1',
            requires_php: '8.0'
          }, null, 2) + '\n');
          NODE

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          PACKAGE="dist/h2o-ia-site-migrator-$VERSION.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" dist/release.json --clobber
          else
            gh release create "$TAG" "$PACKAGE" dist/release.json \
              --target main \
              --title "h2o IA Site Migrator $VERSION" \
              --notes "Corrección estructural: Site Migrator entrega sólo el body. Salient recupera su template nativo, Header Navigator y Footer/Global Section. Se eliminan logo, menú y footer duplicados dentro de las páginas."
          fi

      - name: Publish updater chunks and manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"

          put_file () {
            path="$1"
            file="$2"
            msg="$3"
            encoded="$(base64 -w0 "$file")"
            sha="$(gh api "repos/$REPO/contents/$path?ref=main" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              gh api --method PUT "repos/$REPO/contents/$path" \
                -f message="$msg" -f content="$encoded" -f sha="$sha" -f branch="main" >/dev/null
            else
              gh api --method PUT "repos/$REPO/contents/$path" \
                -f message="$msg" -f content="$encoded" -f branch="main" >/dev/null
            fi
          }

          i=1
          for f in $(find dist/parts -type f -name 'raw-*' | sort); do
            target="$(printf 'bootstrap/%s/part-%02d.b64' "$VERSION" "$i")"
            put_file "$target" "$f" "Site Migrator $VERSION package part $i"
            i=$((i+1))
          done

          put_file "bootstrap/package.sha256" "dist/package.sha256" "Site Migrator $VERSION checksum"
          put_file "bootstrap/release.json" "dist/release-bootstrap.json" "Publish Site Migrator $VERSION updater manifest"
