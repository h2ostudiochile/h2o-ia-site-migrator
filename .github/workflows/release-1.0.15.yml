name: Test and release h2o IA Site Migrator 1.0.15

on:
  push:
    branches:
      - main
      - fix/templa-visual-1.0.15
    paths:
      - '.github/workflows/release-1.0.15.yml'
      - 'bootstrap/trigger-1.0.15.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h2o-ia-site-migrator-1.0.15-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build clean native Salient 1.0.15
        shell: bash
        run: |
          set -Euo pipefail
          trap 'rc=$?; echo "FAILED line $LINENO: $BASH_COMMAND"; exit "$rc"' ERR

          BASE_VERSION="1.0.14"
          VERSION="1.0.15"
          WORK="$RUNNER_TEMP/h2osm-$VERSION"
          DIST="$GITHUB_WORKSPACE/dist-1015"

          rm -rf "$WORK" "$DIST"
          mkdir -p "$WORK/current" "$DIST/parts"

          cat bootstrap/$BASE_VERSION/part-*.b64 | tr -d '\n\r ' | base64 --decode > "$WORK/current.zip"
          unzip -q "$WORK/current.zip" -d "$WORK/current"
          ROOT="$WORK/current/h2o-ia-site-migrator"

          cat > "$ROOT/includes/class-content-validator.php" <<'PHP'
          <?php
          namespace H2O\Site_Migrator;

          if ( ! defined( 'ABSPATH' ) ) {
              exit;
          }

          /**
           * Validates the WPBakery/Salient structure generated by this component.
           *
           * The validator never repairs or rewrites a malformed tree. A migration
           * profile that is not structurally valid is rejected before post_content
           * is touched.
           */
          final class Content_Validator {
              private const CONTAINERS = array(
                  'vc_row',
                  'vc_column',
                  'vc_column_text',
                  'vc_row_inner',
                  'vc_column_inner',
              );

              public static function validate( string $content ) {
                  if ( '' === trim( $content ) ) {
                      return new \WP_Error( 'h2osm_empty_content', 'El contenido de migración está vacío.' );
                  }

                  $forbidden = array(
                      '/\[vc_raw_(?:css|js)\b/i' => 'raw_css_js',
                      '/<style\b/i'                => 'style_block',
                      '/<script\b/i'               => 'script_block',
                      '/\s+css="[^"]*"/i'         => 'wpbakery_css_attribute',
                      '/style="[^"]*(?:--h2osm-|100vw|calc\(|margin-left\s*:|left\s*:\s*50%)[^"]*"/i' => 'structural_inline_css',
                  );

                  foreach ( $forbidden as $pattern => $reason ) {
                      if ( preg_match( $pattern, $content ) ) {
                          return new \WP_Error(
                              'h2osm_forbidden_presentation_patch',
                              'El contenido contiene CSS/JS estructural no autorizado.',
                              array( 'reason' => $reason )
                          );
                      }
                  }

                  if ( ! preg_match_all(
                      '/\[(\/)?(vc_row_inner|vc_column_inner|vc_column_text|vc_row|vc_column)\b[^\]]*\]/i',
                      $content,
                      $matches,
                      PREG_SET_ORDER
                  ) ) {
                      return new \WP_Error( 'h2osm_no_wpbakery_structure', 'No se detectó estructura WPBakery válida.' );
                  }

                  $stack = array();

                  foreach ( $matches as $match ) {
                      $closing = ! empty( $match[1] );
                      $tag     = strtolower( (string) $match[2] );

                      if ( ! in_array( $tag, self::CONTAINERS, true ) ) {
                          continue;
                      }

                      if ( $closing ) {
                          $current = end( $stack );
                          if ( false === $current || $current !== $tag ) {
                              return new \WP_Error(
                                  'h2osm_bad_shortcode_nesting',
                                  'La estructura WPBakery está mal anidada.',
                                  array(
                                      'expected' => false === $current ? null : $current,
                                      'received' => $tag,
                                  )
                              );
                          }
                          array_pop( $stack );
                          continue;
                      }

                      $parent = end( $stack );
                      $parent = false === $parent ? null : $parent;

                      if ( 'vc_row' === $tag && null !== $parent ) {
                          return new \WP_Error( 'h2osm_bad_row_parent', 'vc_row debe ser de nivel superior.' );
                      }
                      if ( 'vc_column' === $tag && 'vc_row' !== $parent ) {
                          return new \WP_Error( 'h2osm_bad_column_parent', 'vc_column debe depender directamente de vc_row.' );
                      }
                      if ( 'vc_row_inner' === $tag && ! in_array( $parent, array( 'vc_column', 'vc_column_inner' ), true ) ) {
                          return new \WP_Error( 'h2osm_bad_inner_row_parent', 'vc_row_inner requiere una columna contenedora.' );
                      }
                      if ( 'vc_column_inner' === $tag && 'vc_row_inner' !== $parent ) {
                          return new \WP_Error( 'h2osm_bad_inner_column_parent', 'vc_column_inner debe depender de vc_row_inner.' );
                      }
                      if ( 'vc_column_text' === $tag && ! in_array( $parent, array( 'vc_column', 'vc_column_inner' ), true ) ) {
                          return new \WP_Error( 'h2osm_bad_text_parent', 'vc_column_text debe depender de una columna.' );
                      }

                      $stack[] = $tag;
                  }

                  if ( ! empty( $stack ) ) {
                      return new \WP_Error(
                          'h2osm_unclosed_shortcodes',
                          'La estructura WPBakery contiene shortcodes sin cerrar.',
                          array( 'open' => array_values( $stack ) )
                      );
                  }

                  return true;
              }
          }
          PHP

          python3 - "$ROOT" "$BASE_VERSION" "$VERSION" <<'PY'
          import pathlib, re, sys

          root = pathlib.Path(sys.argv[1])
          base = sys.argv[2]
          version = sys.argv[3]

          def remove_method(source: str, name: str) -> str:
              marker = f'    public static function {name}('
              start = source.find(marker)
              if start < 0:
                  return source
              brace = source.find('{', start)
              if brace < 0:
                  raise SystemExit(f'METHOD_BRACE_NOT_FOUND:{name}')
              depth = 0
              i = brace
              while i < len(source):
                  ch = source[i]
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          while end < len(source) and source[end] in '\r\n':
                              end += 1
                          return source[:start] + source[end:]
                  i += 1
              raise SystemExit(f'METHOD_NOT_CLOSED:{name}')

          main = root / 'h2o-ia-site-migrator.php'
          s = main.read_text()
          s = re.sub(r'Version:\s*' + re.escape(base), f'Version: {version}', s, count=1)
          s = s.replace(f"define( 'H2OSM_VERSION', '{base}' )", f"define( 'H2OSM_VERSION', '{version}' )")
          s = s.replace("require_once H2OSM_DIR . 'includes/class-salient-setup.php';\n", '')
          validator_req = "require_once H2OSM_DIR . 'includes/class-content-validator.php';"
          if validator_req not in s:
              needle = "require_once H2OSM_DIR . 'includes/class-sync.php';"
              if needle not in s:
                  raise SystemExit('SYNC_REQUIRE_NOT_FOUND')
              s = s.replace(needle, validator_req + "\n" + needle, 1)
          main.write_text(s)

          plugin = root / 'includes/class-plugin.php'
          s = plugin.read_text()
          s = re.sub(r'^\s*Salient_Setup::register\(\);\s*$', '', s, flags=re.M)
          s = re.sub(r"\n\s*add_filter\(\s*'template_include'.*?\);", '', s, count=1, flags=re.S)
          s = re.sub(r"\n\s*add_action\(\s*'wp_enqueue_scripts'.*?\);", '', s, count=1, flags=re.S)
          s = remove_method(s, 'template')
          s = remove_method(s, 'enqueue_assets')
          plugin.write_text(s)

          sync = root / 'includes/class-sync.php'
          s = sync.read_text()
          s = re.sub(r'^\s*Salient_Setup::configure\(\);\s*$', '', s, flags=re.M)

          if 'Content_Validator::validate( $content )' not in s:
              pattern = re.compile(
                  r'(\$post\s*=\s*self::find_page\([^;]+;\s*\n)(\s*\$postarr\s*=\s*array\()',
                  re.S
              )
              m = pattern.search(s)
              if not m:
                  raise SystemExit('SYNC_POSTARR_INSERTION_POINT_NOT_FOUND')
              indent = '            '
              guard = (
                  m.group(1) +
                  "\n" + indent + "$content = (string) $page['content'];\n" +
                  indent + "$validation = Content_Validator::validate( $content );\n" +
                  indent + "if ( is_wp_error( $validation ) ) {\n" +
                  indent + "    $results[] = array(\n" +
                  indent + "        'slug'   => $slug,\n" +
                  indent + "        'ok'     => false,\n" +
                  indent + "        'reason' => 'content_validation_failed',\n" +
                  indent + "        'error'  => $validation->get_error_code(),\n" +
                  indent + "    );\n" +
                  indent + "    continue;\n" +
                  indent + "}\n\n" +
                  m.group(2)
              )
              s = s[:m.start()] + guard + s[m.end():]

          s = re.sub(
              r"'post_content'\s*=>\s*\(string\)\s*\$page\['content'\],",
              "'post_content'   => $content,",
              s
          )
          if "'post_content'   => $content," not in s and "'post_content'      => $content," not in s:
              raise SystemExit('SYNC_CONTENT_ASSIGNMENT_NOT_PATCHED')
          sync.write_text(s)

          profile = root / 'profiles/templa-design.php'
          p = profile.read_text()
          p = p.replace(f'h2o-site-migrator:templa-design:{base}', f'h2o-site-migrator:templa-design:{version}')
          p = p.replace(f'data-h2osm-release="{base}"', f'data-h2osm-release="{version}"')
          p = re.sub(r"'version'\s*=>\s*'[^']+'", f"'version' => '{version}'", p, count=1)
          # 1.0.15 visual normalization. Keep all styling inside Salient-native
          # row/element attributes: no frontend stylesheet, no vc css=, no raw CSS.
          p = p.replace('#0C0C0C', '#2E2B24')

          body_attrs = (
              ' inherited_font_style="default"'
              ' font_size_desktop="16px"'
              ' font_size_tablet="16px"'
              ' font_size_phone="16px"'
              ' font_size_min="16px"'
              ' font_size_max="16px"'
              ' font_line_height="1.55"'
              ' text_direction="default"'
          )

          # Convert reading copy to Salient Responsive Text. Eyebrows, numeric labels,
          # button/link wrapper paragraphs and headings are intentionally left alone.
          para_re = re.compile(
              r'<p(?P<attrs>[^>]*)>(?P<body>.*?)</p>',
              re.S
          )
          body_count = 0
          def responsive_body(match):
              global body_count
              attrs = match.group('attrs') or ''
              body = match.group('body').strip()
              classes = ''
              class_m = re.search(r'class="([^"]*)"', attrs)
              if class_m:
                  classes = class_m.group(1)

              if 'h2osm-eyebrow' in classes:
                  return match.group(0)
              if body.startswith('<a ') or '<strong>' in body:
                  return match.group(0)
              if not body:
                  return match.group(0)

              # h2osm-body-lg and h2osm-lead are semantic labels only; typography is
              # now owned by the native Salient element.
              if classes and not any(x in classes for x in ('h2osm-body-lg','h2osm-lead')):
                  return match.group(0)

              body_count += 1
              return '[nectar_responsive_text' + body_attrs + ']' + body + '[/nectar_responsive_text]'

          p = para_re.sub(responsive_body, p)
          if body_count < 8:
              raise SystemExit(f'BODY_TEXT_CONVERSION_TOO_LOW count={body_count}')

          print(f'TEMPLA_BODY_TEXT_16PX count={body_count}')
          print('TEMPLA_PALETTE #FFC300 #FDFAF3 #2E2B24')
          profile.write_text(p)

          # These files embodied the old rendering layer. 1.0.15 has no renderer
          # and no theme-internal configurator of its own.
          for rel in (
              'includes/class-salient-setup.php',
              'templates/managed-page.php',
              'assets/frontend.css',
          ):
              path = root / rel
              if path.exists():
                  path.unlink()

          # No automatic repair. Validate the release profile exactly as it will ship.
          raw = profile.read_text()
          forbidden = {
              'vc_raw_css_js': r'\[vc_raw_(?:css|js)\b',
              'style_block': r'<style\b',
              'script_block': r'<script\b',
              'wpbakery_css_attr': r'\s+css="[^"]*"',
              'structural_inline_css': r'style="[^"]*(?:--h2osm-|100vw|calc\(|margin-left\s*:|left\s*:\s*50%)[^"]*"',
          }
          for label, pattern in forbidden.items():
              found = re.search(pattern, raw, flags=re.I)
              if found:
                  snippet = raw[max(0, found.start()-120):found.end()+180].replace('\n', ' ')
                  raise SystemExit(f'FORBIDDEN_{label}: {snippet}')

          token_re = re.compile(r'\[(?P<close>/)?(?P<tag>vc_row_inner|vc_column_inner|vc_column_text|vc_row|vc_column)\b[^\]]*\]', re.I)
          stack = []
          for m in token_re.finditer(raw):
              tag = m.group('tag').lower()
              if not m.group('close'):
                  parent = stack[-1] if stack else None
                  if tag == 'vc_row' and parent is not None:
                      raise SystemExit(f'BAD_PARENT vc_row parent={parent}')
                  if tag == 'vc_column' and parent != 'vc_row':
                      raise SystemExit(f'BAD_PARENT vc_column parent={parent}')
                  if tag == 'vc_row_inner' and parent not in ('vc_column','vc_column_inner'):
                      raise SystemExit(f'BAD_PARENT vc_row_inner parent={parent}')
                  if tag == 'vc_column_inner' and parent != 'vc_row_inner':
                      raise SystemExit(f'BAD_PARENT vc_column_inner parent={parent}')
                  if tag == 'vc_column_text' and parent not in ('vc_column','vc_column_inner'):
                      raise SystemExit(f'BAD_PARENT vc_column_text parent={parent}')
                  stack.append(tag)
              else:
                  if not stack or stack[-1] != tag:
                      raise SystemExit(f'BAD_NESTING close={tag} stack={stack[-8:]}')
                  stack.pop()
          if stack:
              raise SystemExit(f'UNCLOSED {stack[-8:]}')

          print('NATIVE_SALIENT_1015_PROFILE_OK')
          PY

          {
            echo "## $VERSION — 2026-10-05"
            echo "- Ajusta la paleta Templa a #FFC300 / #FDFAF3 / #2E2B24."
            echo "- Pasa el texto de lectura a Nectar Responsive Text nativo a 16 px y line-height 1.55."
            echo "- Mantiene intactas las guardas 1.0.14: sin template paralelo, sin CSS del migrador y sin internals de Salient."
            echo "- No modifica la configuración global de tipografía ni navegación del tema; esas siguen siendo propiedad de Salient."
            echo "- Conserva el contenido canónico de 1.0.14 y evoluciona de forma aditiva."
            echo
            cat "$ROOT/CHANGELOG.md"
          } > "$WORK/CHANGELOG.md"
          mv "$WORK/CHANGELOG.md" "$ROOT/CHANGELOG.md"

          php -l "$ROOT/h2o-ia-site-migrator.php" >/dev/null
          php -l "$ROOT/includes/class-plugin.php" >/dev/null
          php -l "$ROOT/includes/class-sync.php" >/dev/null
          php -l "$ROOT/includes/class-content-validator.php" >/dev/null
          php -l "$ROOT/profiles/templa-design.php" >/dev/null

          grep -q "Version: $VERSION" "$ROOT/h2o-ia-site-migrator.php"
          grep -q "Content_Validator::validate" "$ROOT/includes/class-sync.php"
          ! grep -R -q "salient_redux" "$ROOT"
          ! grep -R -q "Salient_Setup" "$ROOT"
          ! grep -q "template_include" "$ROOT/includes/class-plugin.php"
          ! grep -q "wp_enqueue_scripts" "$ROOT/includes/class-plugin.php"
          test ! -e "$ROOT/templates/managed-page.php"
          test ! -e "$ROOT/assets/frontend.css"
          ! grep -q '#0C0C0C' "$ROOT/profiles/templa-design.php"
          grep -q '#2E2B24' "$ROOT/profiles/templa-design.php"
          grep -q 'font_size_desktop="16px"' "$ROOT/profiles/templa-design.php"
          grep -q 'font_line_height="1.55"' "$ROOT/profiles/templa-design.php"

          (cd "$WORK/current" && zip -qr "$DIST/h2o-ia-site-migrator-$VERSION.zip" h2o-ia-site-migrator)
          SHA="$(sha256sum "$DIST/h2o-ia-site-migrator-$VERSION.zip" | awk '{print $1}')"
          echo "$SHA" > "$DIST/package.sha256"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_SHA=$SHA" >> "$GITHUB_ENV"

          base64 -w0 "$DIST/h2o-ia-site-migrator-$VERSION.zip" > "$DIST/package.b64"
          split -b 5000 -d -a 2 "$DIST/package.b64" "$DIST/parts/raw-"

          python3 - "$VERSION" "$SHA" "$DIST" <<'PY'
          import json, pathlib, sys
          version, sha, dist = sys.argv[1], sys.argv[2], pathlib.Path(sys.argv[3])
          raw = sorted((dist / 'parts').glob('raw-*'))
          parts = [
              f'https://raw.githubusercontent.com/h2ostudiochile/h2o-ia-site-migrator/main/bootstrap/{version}/part-{i:02d}.b64'
              for i in range(1, len(raw)+1)
          ]
          bootstrap = {
              'version': version,
              'package_id': 'https://raw.githubusercontent.com/h2ostudiochile/h2o-ia-site-migrator/main/bootstrap/package.sha256',
              'package_sha256': sha,
              'parts': parts,
              'tested': '7.1',
              'requires_php': '8.0',
          }
          release = {
              'version': version,
              'package_url': f'https://github.com/h2ostudiochile/h2o-ia-site-migrator/releases/download/v{version}/h2o-ia-site-migrator-{version}.zip',
              'package_sha256': sha,
              'tested': '7.1',
              'requires_php': '8.0',
          }
          (dist / 'release-bootstrap.json').write_text(json.dumps(bootstrap, indent=2) + '\n')
          (dist / 'release.json').write_text(json.dumps(release, indent=2) + '\n')
          PY

      - name: Upload tested package
        uses: actions/upload-artifact@v4
        with:
          name: h2o-ia-site-migrator-1.0.15-tested
          path: |
            dist-1015/h2o-ia-site-migrator-1.0.15.zip
            dist-1015/release.json
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          PACKAGE="dist-1015/h2o-ia-site-migrator-$VERSION.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" dist-1015/release.json --clobber
          else
            gh release create "$TAG" "$PACKAGE" dist-1015/release.json               --target main               --title "h2o IA Site Migrator $VERSION"               --notes "Refinamiento visual Templa sobre render nativo Salient/WPBakery: paleta corporativa y body 16 px con Nectar Responsive Text, sin CSS ni acceso a internals de Salient."
          fi

      - name: Publish updater chunks and manifest
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"

          put_file () {
            path="$1"
            file="$2"
            msg="$3"
            encoded="$(base64 -w0 "$file")"
            sha="$(gh api "repos/$REPO/contents/$path?ref=main" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              gh api --method PUT "repos/$REPO/contents/$path"                 -f message="$msg" -f content="$encoded" -f sha="$sha" -f branch="main" >/dev/null
            else
              gh api --method PUT "repos/$REPO/contents/$path"                 -f message="$msg" -f content="$encoded" -f branch="main" >/dev/null
            fi
          }

          i=1
          for f in $(find dist-1015/parts -type f -name 'raw-*' | sort); do
            target="$(printf 'bootstrap/%s/part-%02d.b64' "$VERSION" "$i")"
            put_file "$target" "$f" "Site Migrator $VERSION package part $i"
            i=$((i+1))
          done

          put_file "bootstrap/package.sha256" "dist-1015/package.sha256" "Site Migrator $VERSION checksum"
          put_file "bootstrap/release.json" "dist-1015/release-bootstrap.json" "Publish Site Migrator $VERSION updater manifest"
