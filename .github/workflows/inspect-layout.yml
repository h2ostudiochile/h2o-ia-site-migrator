name: Inspect known-good layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-layout.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild 1.0.3 and inspect layout
        shell: bash
        run: |
          set -euo pipefail
          REF="1645d5713a9d727138cf66e6cb7480be8564acd6"
          mkdir -p /tmp/h2osm103
          for i in 01 02 03; do
            git show "$REF:bootstrap/part-$i.b64"
          done | tr -d '\n\r ' | base64 --decode > /tmp/h2osm103.zip
          unzip -q /tmp/h2osm103.zip -d /tmp/h2osm103
          ROOT="/tmp/h2osm103/h2o-ia-site-migrator"
          echo '=== PROFILE ROWS ==='
          grep -n "\[vc_row" "$ROOT/profiles/templa-design.php" || true
          echo '=== PROFILE HERO/SERVICE/BLOG CONTEXT ==='
          grep -nE "h2osm-(hero|subhero|section|service|blog|project)|nectar_post_grid|stretch_row" "$ROOT/profiles/templa-design.php" | head -n 260 || true
          echo '=== CSS LAYOUT ==='
          grep -nE "h2osm-(site|hero|subhero|section|service|blog|project)|row_col_wrap|100vw|max-width|margin-left|margin-right" "$ROOT/assets/frontend.css" | head -n 320 || true
