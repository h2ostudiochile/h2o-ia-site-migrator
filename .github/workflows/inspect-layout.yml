name: Inspect 1.0.8 funnel insertion points

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-layout.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect profile
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/h2osm108
          mkdir -p /tmp/h2osm108
          cat bootstrap/1.0.8/part-*.b64 | tr -d '\n\r ' | base64 --decode > /tmp/h2osm108.zip
          unzip -q /tmp/h2osm108.zip -d /tmp/h2osm108
          ROOT="/tmp/h2osm108/h2o-ia-site-migrator"
          echo '=== PROFILE HEAD ==='
          sed -n '1,180p' "$ROOT/profiles/templa-design.php"
          echo '=== PROFILE MID ==='
          sed -n '180,380p' "$ROOT/profiles/templa-design.php"
          echo '=== PLUGIN ==='
          sed -n '1,220p' "$ROOT/includes/class-plugin.php"
