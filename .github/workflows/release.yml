name: Release h2o IA Site Migrator
# release channel

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h2o-ia-site-migrator-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist work
          cat bootstrap/part-*.b64 | tr -d '\n\r ' | base64 --decode > dist/package.zip
          EXPECTED="$(tr -d '\n\r ' < bootstrap/package.sha256)"
          ACTUAL="$(sha256sum dist/package.zip | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          unzip -t dist/package.zip >/dev/null
          unzip -q dist/package.zip -d work

          VERSION="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' work/h2o-ia-site-migrator/h2o-ia-site-migrator.php | head -n1 | tr -d '\r')"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_SHA256=$ACTUAL" >> "$GITHUB_ENV"

          grep -q "Update URI: https://github.com/h2ostudiochile/h2o-ia-site-migrator" work/h2o-ia-site-migrator/h2o-ia-site-migrator.php
          grep -q "update_plugins_github.com" work/h2o-ia-site-migrator/includes/class-updater.php
          grep -q "h2o-site-migrator:templa-design:$VERSION" work/h2o-ia-site-migrator/profiles/templa-design.php

          mv dist/package.zip "dist/h2o-ia-site-migrator-$VERSION.zip"

          PACKAGE_URL="https://github.com/h2ostudiochile/h2o-ia-site-migrator/releases/download/v$VERSION/h2o-ia-site-migrator-$VERSION.zip"
          node -e '
            const fs=require("fs");
            const [version,url,sha]=process.argv.slice(1);
            fs.writeFileSync("dist/release.json",JSON.stringify({
              version,
              package_url:url,
              package_sha256:sha,
              tested:"7.1",
              requires_php:"8.0"
            },null,2)+"\n");
          ' "$VERSION" "$PACKAGE_URL" "$ACTUAL"

      - name: Inspect layout source
        shell: bash
        run: |
          echo '--- CSS layout rules ---'
          grep -nE 'full|bleed|inner|section|content|hero|blog' work/h2o-ia-site-migrator/assets/frontend.css | head -n 220 || true
          echo '--- CSS 1.0.4 tail ---'
          sed -n '72,95p' work/h2o-ia-site-migrator/assets/frontend.css || true
          echo '--- Profile layout markers ---'
          grep -nE 'full_width|stretch_row|h2osm-|blog|hero|section' work/h2o-ia-site-migrator/profiles/templa-design.php | head -n 260 || true

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          PACKAGE="dist/h2o-ia-site-migrator-$VERSION.zip"
          MANIFEST="dist/release.json"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" "$MANIFEST" --clobber
          else
            gh release create "$TAG" "$PACKAGE" "$MANIFEST" \
              --target main \
              --title "h2o IA Site Migrator $VERSION" \
              --notes "Canal de actualización nativo con verificación SHA-256. Templa conserva / intacto y usa /inicio/ como entorno de prueba."
          fi
