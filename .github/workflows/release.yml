name: Release h2o IA Site Migrator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'bootstrap/trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h2o-ia-site-migrator-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build 1.0.10 clean native Salient rows
        shell: bash
        run: |
          set -euo pipefail

          BASE_VERSION="1.0.9"
          VERSION="1.0.10"
          WORK="$RUNNER_TEMP/h2osm-$VERSION"
          DIST="$GITHUB_WORKSPACE/dist"

          rm -rf "$WORK" "$DIST"
          mkdir -p "$WORK/current" "$DIST/parts"

          cat bootstrap/$BASE_VERSION/part-*.b64 | tr -d '\n\r ' | base64 --decode > "$WORK/current.zip"
          unzip -q "$WORK/current.zip" -d "$WORK/current"
          ROOT="$WORK/current/h2o-ia-site-migrator"

          cat > "$ROOT/includes/class-salient-setup.php" <<'PHP'
          <?php
          namespace H2O\Site_Migrator;

          if ( ! defined( 'ABSPATH' ) ) {
              exit;
          }

          /**
           * Uses only WordPress public navigation APIs.
           * No Salient options, Redux values, files, postmeta or internals are read/written.
           */
          final class Salient_Setup {
              private const MENU_NAME = 'Templa Principal';

              public static function register(): void {
                  add_action( 'init', array( self::class, 'ensure_primary_menu' ), 50 );
              }

              public static function ensure_primary_menu(): void {
                  $profile = Registry::current_profile();
                  if ( ! is_array( $profile ) || 'templa-design' !== (string) ( $profile['key'] ?? '' ) ) {
                      return;
                  }

                  $registered = get_registered_nav_menus();
                  if ( ! isset( $registered['top_nav'] ) ) {
                      return;
                  }

                  $menu = wp_get_nav_menu_object( self::MENU_NAME );
                  if ( ! $menu ) {
                      $menu_id = wp_create_nav_menu( self::MENU_NAME );
                      if ( is_wp_error( $menu_id ) ) {
                          return;
                      }
                      $menu = wp_get_nav_menu_object( (int) $menu_id );
                  }
                  if ( ! $menu ) {
                      return;
                  }

                  $menu_id = (int) $menu->term_id;
                  $items = wp_get_nav_menu_items( $menu_id );
                  $items = is_array( $items ) ? $items : array();
                  $by_object = array();

                  foreach ( $items as $item ) {
                      if ( isset( $item->object_id ) ) {
                          $by_object[ (int) $item->object_id ] = (int) $item->ID;
                      }
                  }

                  $wanted = array(
                      array( 'slug' => 'inicio', 'label' => 'Inicio' ),
                      array( 'slug' => 'quienes-somos', 'label' => 'Quiénes somos' ),
                      array( 'slug' => 'servicios', 'label' => 'Servicios' ),
                      array( 'slug' => 'portafolio', 'label' => 'Portafolio' ),
                      array( 'slug' => 'blog', 'label' => 'Blog' ),
                      array( 'slug' => 'contacto', 'label' => 'Contacto' ),
                  );

                  $position = 1;
                  foreach ( $wanted as $entry ) {
                      $page = get_page_by_path( $entry['slug'], OBJECT, 'page' );
                      if ( ! $page instanceof \WP_Post ) {
                          $position++;
                          continue;
                      }

                      $item_id = $by_object[ (int) $page->ID ] ?? 0;
                      wp_update_nav_menu_item(
                          $menu_id,
                          $item_id,
                          array(
                              'menu-item-title'     => $entry['label'],
                              'menu-item-object-id' => (int) $page->ID,
                              'menu-item-object'    => 'page',
                              'menu-item-type'      => 'post_type',
                              'menu-item-status'    => 'publish',
                              'menu-item-position'  => $position,
                          )
                      );
                      $position++;
                  }

                  $locations = get_theme_mod( 'nav_menu_locations', array() );
                  $locations = is_array( $locations ) ? $locations : array();
                  if ( (int) ( $locations['top_nav'] ?? 0 ) !== $menu_id ) {
                      $locations['top_nav'] = $menu_id;
                      set_theme_mod( 'nav_menu_locations', $locations );
                  }
              }
          }
          PHP

          python3 - "$ROOT" "$BASE_VERSION" "$VERSION" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          base = sys.argv[2]
          version = sys.argv[3]

          main = root / "h2o-ia-site-migrator.php"
          m = main.read_text()
          m = m.replace(f"Version: {base}", f"Version: {version}")
          m = m.replace(f"define( 'H2OSM_VERSION', '{base}' )", f"define( 'H2OSM_VERSION', '{version}' )")
          needle = "require_once H2OSM_DIR . 'includes/class-plugin.php';"
          if "includes/class-salient-setup.php" not in m:
              m = m.replace(needle, "require_once H2OSM_DIR . 'includes/class-salient-setup.php';\n" + needle)
          main.write_text(m)

          plugin = root / "includes/class-plugin.php"
          s = plugin.read_text()
          if "Salient_Setup::register();" not in s:
              s = s.replace("        Funnels::register();", "        Funnels::register();\n        Salient_Setup::register();")
          plugin.write_text(s)

          profile = root / "profiles/templa-design.php"
          p = profile.read_text()

          # Salient owns row geometry. Do not combine the Salient type attribute
          # with WPBakery's generic stretch_row/full_width attributes.
          p = re.sub(r'\s+full_width="stretch_row_content_no_spaces"', '', p)
          p = re.sub(r'\s+full_width="stretch_row"', '', p)
          p = p.replace(' h2osm-fullbleed', '')
          p = p.replace(' h2osm-bg-row', '')

          # Put hero/subhero backgrounds on the native Salient row itself instead
          # of creating an extra HTML section which the builder cannot reason about.
          hero_patterns = [
              (
                  r'\[vc_row type="full_width_content" el_class="h2osm-hero-row"\]\[vc_column\]\[vc_column_text\]\s*<section class="h2osm-hero" style="--h2osm-bg:url\(\'([^\']+)\'\)">\s*<div class="h2osm-hero-overlay"></div>\s*<div class="h2osm-hero-copy">(.*?)</div>\s*</section>\s*\[/vc_column_text\]\[/vc_column\]\[/vc_row\]',
                  lambda m: '[vc_row type="full_width_content" bg_image="' + m.group(1) + '" bg_position="center center" bg_repeat="no-repeat" scene_position="center" text_color="light" text_align="left" top_padding="14%" bottom_padding="14%" overlay_strength="0.35" el_class="h2osm-hero-row"][vc_column column_padding="padding-8-percent" column_padding_position="left-right"][vc_column_text]<div class="h2osm-hero-copy">' + m.group(2).strip() + '</div>[/vc_column_text][/vc_column][/vc_row]'
              ),
              (
                  r'\[vc_row type="full_width_content" el_class="h2osm-visual-row"\]\[vc_column\]\[vc_column_text\]<section class="h2osm-subhero" style="--h2osm-bg:url\(\'([^\']+)\'\)"><div class="h2osm-hero-overlay"></div><div>(.*?)</div></section>\[/vc_column_text\]\[/vc_column\]\[/vc_row\]',
                  lambda m: '[vc_row type="full_width_content" bg_image="' + m.group(1) + '" bg_position="center center" bg_repeat="no-repeat" scene_position="center" text_color="light" text_align="left" top_padding="10%" bottom_padding="10%" overlay_strength="0.35" el_class="h2osm-visual-row"][vc_column column_padding="padding-8-percent" column_padding_position="left-right"][vc_column_text]' + m.group(2).strip() + '[/vc_column_text][/vc_column][/vc_row]'
              ),
          ]
          for pattern, repl in hero_patterns:
              p, _ = re.subn(pattern, repl, p, flags=re.S)

          # Keep one semantic row for each section; no empty structural rows.
          p = re.sub(r'\[vc_row([^\]]*)\]\[vc_column([^\]]*)\]\s*\[/vc_column\]\[/vc_row\]', '', p, flags=re.S)
          p = re.sub(r'\[vc_row([^\]]*)\]\s*\[/vc_row\]', '', p, flags=re.S)

          p = p.replace(f"h2o-site-migrator:templa-design:{base}", f"h2o-site-migrator:templa-design:{version}")
          p = p.replace(f'data-h2osm-release="{base}"', f'data-h2osm-release="{version}"')
          p = re.sub(r"'version'\s*=>\s*'[^']+'", f"'version' => '{version}'", p, count=1)
          profile.write_text(p)

          css = root / "assets/frontend.css"
          c = css.read_text()
          # Remove geometry hacks. Width belongs to Salient row types.
          c = re.sub(r'(?s)\.h2osm-fullbleed\s*\{.*?\}', '', c)
          c = re.sub(r'(?s)\.h2osm-hero-row\s*>\s*\.span_12\s*\{.*?\}', '', c)
          c = re.sub(r'(?s)\.h2osm-visual-row\s*>\s*\.span_12\s*\{.*?\}', '', c)
          c = c.replace('width:100vw;', '')
          c = c.replace('width: 100vw;', '')
          c = c.replace('margin-left:calc(50% - 50vw);', '')
          c = c.replace('margin-left: calc(50% - 50vw);', '')
          css.write_text(c)
          PY

          {
            echo "## $VERSION — 2026-10-05"
            echo "- Corrige la geometría de filas: usa únicamente type=full_width_content o type=full_width_background de Salient, sin mezclar stretch_row de WPBakery."
            echo "- Elimina hacks 100vw/margin-left y clases fullbleed que desplazaban/cortaban las filas."
            echo "- Mueve las imágenes hero/subhero al background nativo de la Row de Salient; deja de envolverlas en secciones HTML paralelas."
            echo "- Elimina filas estructuralmente vacías."
            echo "- Crea/actualiza el menú Templa Principal con WordPress Core y lo asigna a la ubicación pública top_nav registrada por Salient."
            echo "- No escribe opciones internas de Salient/Redux: logo, colores y footer siguen perteneciendo a Header Navigation, Accent Colors y Global Sections."
            echo
            cat "$ROOT/CHANGELOG.md"
          } > "$WORK/CHANGELOG.md"
          mv "$WORK/CHANGELOG.md" "$ROOT/CHANGELOG.md"

          php -l "$ROOT/h2o-ia-site-migrator.php" >/dev/null
          php -l "$ROOT/includes/class-plugin.php" >/dev/null
          php -l "$ROOT/includes/class-salient-setup.php" >/dev/null
          php -l "$ROOT/profiles/templa-design.php" >/dev/null
          grep -q "Version: $VERSION" "$ROOT/h2o-ia-site-migrator.php"
          grep -q "Salient_Setup::register();" "$ROOT/includes/class-plugin.php"
          grep -q "top_nav" "$ROOT/includes/class-salient-setup.php"
          ! grep -q 'full_width="stretch_row' "$ROOT/profiles/templa-design.php"
          ! grep -q 'h2osm-fullbleed' "$ROOT/profiles/templa-design.php"
          ! grep -q 'width:100vw' "$ROOT/assets/frontend.css"
          ! grep -q 'margin-left:calc(50% - 50vw)' "$ROOT/assets/frontend.css"
          grep -q 'type="full_width_content"' "$ROOT/profiles/templa-design.php"
          grep -q 'type="full_width_background"' "$ROOT/profiles/templa-design.php"

          python3 - "$ROOT/profiles/templa-design.php" <<'PY'
          import re, sys, pathlib
          s=pathlib.Path(sys.argv[1]).read_text()
          for row in re.findall(r'\[vc_row[^\]]*\].*?\[/vc_row\]', s, re.S):
              inner=re.sub(r'\[/?vc_column[^\]]*\]|\[/?vc_column_text[^\]]*\]|\[/?vc_row[^\]]*\]','',row)
              inner=re.sub(r'<!--.*?-->','',inner,flags=re.S).strip()
              if not re.sub(r'\s+','',inner):
                  raise SystemExit('empty vc_row found')
          print('NO_EMPTY_ROWS')
          PY

          (cd "$WORK/current" && zip -qr "$DIST/h2o-ia-site-migrator-$VERSION.zip" h2o-ia-site-migrator)
          SHA="$(sha256sum "$DIST/h2o-ia-site-migrator-$VERSION.zip" | awk '{print $1}')"
          echo "$SHA" > "$DIST/package.sha256"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          base64 -w0 "$DIST/h2o-ia-site-migrator-$VERSION.zip" > "$DIST/package.b64"
          split -b 5000 -d -a 2 "$DIST/package.b64" "$DIST/parts/raw-"

          node - "$VERSION" "$SHA" <<'NODE'
          const fs = require('fs');
          const [version, sha] = process.argv.slice(2);
          const raw = fs.readdirSync('dist/parts').sort();
          const parts = raw.map((f,i) =>
            'https://raw.githubusercontent.com/h2ostudiochile/h2o-ia-site-migrator/main/bootstrap/' +
            version + '/part-' + String(i + 1).padStart(2,'0') + '.b64'
          );
          fs.writeFileSync('dist/release-bootstrap.json', JSON.stringify({
            version,
            package_id: 'https://raw.githubusercontent.com/h2ostudiochile/h2o-ia-site-migrator/main/bootstrap/package.sha256',
            package_sha256: sha,
            parts,
            tested: '7.1',
            requires_php: '8.0'
          }, null, 2) + '\n');
          fs.writeFileSync('dist/release.json', JSON.stringify({
            version,
            package_url: 'https://github.com/h2ostudiochile/h2o-ia-site-migrator/releases/download/v' + version + '/h2o-ia-site-migrator-' + version + '.zip',
            package_sha256: sha,
            tested: '7.1',
            requires_php: '8.0'
          }, null, 2) + '\n');
          NODE

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          PACKAGE="dist/h2o-ia-site-migrator-$VERSION.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" dist/release.json --clobber
          else
            gh release create "$TAG" "$PACKAGE" dist/release.json \
              --target main \
              --title "h2o IA Site Migrator $VERSION" \
              --notes "Limpieza estructural Salient: filas nativas sin doble sistema de ancho, sin hacks 100vw, sin filas vacías y menú WordPress asignado a top_nav. No toca internals de Salient."
          fi

      - name: Publish updater chunks and manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"

          put_file () {
            path="$1"
            file="$2"
            msg="$3"
            encoded="$(base64 -w0 "$file")"
            sha="$(gh api "repos/$REPO/contents/$path?ref=main" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              gh api --method PUT "repos/$REPO/contents/$path" \
                -f message="$msg" -f content="$encoded" -f sha="$sha" -f branch="main" >/dev/null
            else
              gh api --method PUT "repos/$REPO/contents/$path" \
                -f message="$msg" -f content="$encoded" -f branch="main" >/dev/null
            fi
          }

          i=1
          for f in $(find dist/parts -type f -name 'raw-*' | sort); do
            target="$(printf 'bootstrap/%s/part-%02d.b64' "$VERSION" "$i")"
            put_file "$target" "$f" "Site Migrator $VERSION package part $i"
            i=$((i+1))
          done

          put_file "bootstrap/package.sha256" "dist/package.sha256" "Site Migrator $VERSION checksum"
          put_file "bootstrap/release.json" "dist/release-bootstrap.json" "Publish Site Migrator $VERSION updater manifest"
