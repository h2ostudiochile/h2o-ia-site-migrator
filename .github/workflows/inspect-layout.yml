name: Inspect known-good layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-layout.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare 1.0.3 good layout with 1.0.5 blog/profile
        shell: bash
        run: |
          set -euo pipefail

          REF="1645d5713a9d727138cf66e6cb7480be8564acd6"
          rm -rf /tmp/h2osm103 /tmp/h2osm105
          mkdir -p /tmp/h2osm103 /tmp/h2osm105

          for i in 01 02 03; do
            git show "$REF:bootstrap/part-$i.b64"
          done | tr -d '\n\r ' | base64 --decode > /tmp/h2osm103.zip
          unzip -q /tmp/h2osm103.zip -d /tmp/h2osm103

          cat bootstrap/1.0.5/v2-part-*.b64 | tr -d '\n\r ' | base64 --decode > /tmp/h2osm105.zip
          unzip -q /tmp/h2osm105.zip -d /tmp/h2osm105

          GOOD="/tmp/h2osm103/h2o-ia-site-migrator"
          CUR="/tmp/h2osm105/h2o-ia-site-migrator"

          echo '=== GOOD 1.0.3 SERVICES ==='
          sed -n '88,98p' "$GOOD/profiles/templa-design.php"
          echo '=== CURRENT 1.0.5 SERVICES ==='
          sed -n '88,102p' "$CUR/profiles/templa-design.php"
          echo '=== CURRENT 1.0.5 BLOG ==='
          grep -nE 'blog|nectar_post_grid|post_grid|featured' "$CUR/profiles/templa-design.php" | head -n 120 || true
          echo '=== CURRENT 1.0.5 CSS APPENDED RULES ==='
          tail -n 150 "$CUR/assets/frontend.css"
