name: Test and release h2o IA Site Migrator 1.0.16

on:
  push:
    branches:
      - main
      - fix/templa-salient-preset-1.0.16
    paths:
      - '.github/workflows/release-1.0.16.yml'
      - 'presets/templa-salient-theme-options.json'
      - 'bootstrap/trigger-1.0.16.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h2o-ia-site-migrator-1.0.16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build 1.0.16 with Salient-owned typography
        shell: bash
        run: |
          set -Euo pipefail
          trap 'rc=$?; echo "FAILED line $LINENO: $BASH_COMMAND"; exit "$rc"' ERR

          BASE_VERSION="1.0.15"
          VERSION="1.0.16"
          WORK="$RUNNER_TEMP/h2osm-$VERSION"
          DIST="$GITHUB_WORKSPACE/dist-1016"

          rm -rf "$WORK" "$DIST"
          mkdir -p "$WORK/current" "$DIST/parts"

          cat bootstrap/$BASE_VERSION/part-*.b64 | tr -d '\n\r ' | base64 --decode > "$WORK/current.zip"
          unzip -q "$WORK/current.zip" -d "$WORK/current"
          ROOT="$WORK/current/h2o-ia-site-migrator"

          python3 - "$ROOT" "$BASE_VERSION" "$VERSION" <<'PY'
          import json, pathlib, re, sys

          root = pathlib.Path(sys.argv[1])
          base = sys.argv[2]
          version = sys.argv[3]

          main = root / 'h2o-ia-site-migrator.php'
          s = main.read_text()
          s = re.sub(r'Version:\s*' + re.escape(base), f'Version: {version}', s, count=1)
          s = s.replace(f"define( 'H2OSM_VERSION', '{base}' )", f"define( 'H2OSM_VERSION', '{version}' )")
          main.write_text(s)

          profile = root / 'profiles/templa-design.php'
          p = profile.read_text()
          p = p.replace(f'h2o-site-migrator:templa-design:{base}', f'h2o-site-migrator:templa-design:{version}')
          p = p.replace(f'data-h2osm-release="{base}"', f'data-h2osm-release="{version}"')
          p = re.sub(r"'version'\s*=>\s*'[^']+'", f"'version' => '{version}'", p, count=1)

          # 1.0.15 made body sizing explicit per content block. Now that Templa has
          # a canonical Salient typography preset, return reading copy to normal
          # paragraphs so Theme Options owns type globally.
          responsive = re.compile(
              r'\[nectar_responsive_text\s+'
              r'inherited_font_style="default"\s+'
              r'font_size_desktop="16px"\s+'
              r'font_size_tablet="16px"\s+'
              r'font_size_phone="16px"\s+'
              r'font_size_min="16px"\s+'
              r'font_size_max="16px"\s+'
              r'font_line_height="1\.55"\s+'
              r'text_direction="default"\]'
              r'(?P<body>.*?)'
              r'\[/nectar_responsive_text\]',
              re.S
          )
          p, restored = responsive.subn(lambda m: '<p>' + m.group('body').strip() + '</p>', p)
          if restored < 20:
              raise SystemExit(f'BODY_PARAGRAPH_RESTORE_TOO_LOW count={restored}')

          if 'font_size_desktop="16px"' in p:
              raise SystemExit('HARDCODED_BODY_SIZE_REMAINS')

          profile.write_text(p)
          print(f'TEMPLA_BODY_OWNED_BY_SALIENT restored={restored}')

          # Bundle the operator preset as documentation/configuration data only.
          # The runtime never imports or writes it into Salient.
          preset_source = pathlib.Path('presets/templa-salient-theme-options.json')
          preset = json.loads(preset_source.read_text())
          assert preset['header_navigation']['logo_height'] == 62
          assert preset['header_navigation']['header_hover_effect']['value'] == 'default'
          assert preset['palette']['accent_color'] == '#FFC300'
          assert preset['typography']['general_html_elements']['body_font_family']['family'] == 'Manrope'
          assert preset['typography']['general_html_elements']['body_font_family']['size'] == '1rem'
          assert preset['typography']['spacing']['heading_bottom_spacing'] == '0.55em'
          assert preset['typography']['spacing']['paragraph_bottom_spacing'] == '1.25em'
          assert preset['architecture']['runtime_theme_mutation'] is False

          dst = root / 'presets'
          dst.mkdir(parents=True, exist_ok=True)
          (dst / 'templa-salient-theme-options.json').write_text(json.dumps(preset, indent=2) + '\n')
          print('TEMPLA_SALIENT_PRESET_OK')

          # Fail closed: the plugin PHP itself must not mutate Salient theme internals.
          for php in root.rglob('*.php'):
              src = php.read_text(errors='ignore')
              if "get_option( 'salient_redux'" in src or "get_option('salient_redux'" in src:
                  raise SystemExit(f'SALIENT_INTERNAL_READ:{php}')
              if "update_option( 'salient_redux'" in src or "update_option('salient_redux'" in src:
                  raise SystemExit(f'SALIENT_INTERNAL_WRITE:{php}')
              if 'Salient_Setup' in src:
                  raise SystemExit(f'SALIENT_SETUP_RUNTIME:{php}')
          PY

          # Validate the existing fail-closed Bakery rules still hold.
          php -l "$ROOT/h2o-ia-site-migrator.php" >/dev/null
          php -l "$ROOT/includes/class-plugin.php" >/dev/null
          php -l "$ROOT/includes/class-sync.php" >/dev/null
          php -l "$ROOT/includes/class-content-validator.php" >/dev/null
          php -l "$ROOT/profiles/templa-design.php" >/dev/null

          grep -q "Version: $VERSION" "$ROOT/h2o-ia-site-migrator.php"
          grep -q "Content_Validator::validate" "$ROOT/includes/class-sync.php"
          ! grep -R --include='*.php' -q "salient_redux" "$ROOT"
          ! grep -R --include='*.php' -q "Salient_Setup" "$ROOT"
          ! grep -q "template_include" "$ROOT/includes/class-plugin.php"
          test ! -e "$ROOT/templates/managed-page.php"
          test ! -e "$ROOT/assets/frontend.css"
          ! grep -q 'font_size_desktop="16px"' "$ROOT/profiles/templa-design.php"
          grep -q '#FFC300' "$ROOT/profiles/templa-design.php"
          grep -q '#2E2B24' "$ROOT/profiles/templa-design.php"
          grep -q '"logo_height": 62' "$ROOT/presets/templa-salient-theme-options.json"
          grep -q '"family": "Manrope"' "$ROOT/presets/templa-salient-theme-options.json"

          {
            echo "## $VERSION — 2026-10-05"
            echo "- Devuelve el body a párrafos normales para que Typography global de Salient sea la única fuente tipográfica."
            echo "- Incluye preset operador Templa: Manrope, logo 62, Accent #FFC300 y Header Hover Color Change."
            echo "- Define Navigation, Page Header, H1-H6, labels, Nectar Elements, Responsive/Fluid Typography y spacing."
            echo "- El preset es declarativo: Site Migrator no lee ni escribe salient_redux ni ningún internal de Salient."
            echo "- Mantiene las validaciones fail-closed de WPBakery y la paleta Templa de 1.0.15."
            echo
            cat "$ROOT/CHANGELOG.md"
          } > "$WORK/CHANGELOG.md"
          mv "$WORK/CHANGELOG.md" "$ROOT/CHANGELOG.md"

          (cd "$WORK/current" && zip -qr "$DIST/h2o-ia-site-migrator-$VERSION.zip" h2o-ia-site-migrator)
          SHA="$(sha256sum "$DIST/h2o-ia-site-migrator-$VERSION.zip" | awk '{print $1}')"
          echo "$SHA" > "$DIST/package.sha256"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_SHA=$SHA" >> "$GITHUB_ENV"

          base64 -w0 "$DIST/h2o-ia-site-migrator-$VERSION.zip" > "$DIST/package.b64"
          split -b 5000 -d -a 2 "$DIST/package.b64" "$DIST/parts/raw-"

          python3 - "$VERSION" "$SHA" "$DIST" <<'PY'
          import json, pathlib, sys
          version, sha, dist = sys.argv[1], sys.argv[2], pathlib.Path(sys.argv[3])
          raw = sorted((dist / 'parts').glob('raw-*'))
          parts = [
              f'https://raw.githubusercontent.com/h2ostudiochile/h2o-ia-site-migrator/main/bootstrap/{version}/part-{i:02d}.b64'
              for i in range(1, len(raw)+1)
          ]
          bootstrap = {
              'version': version,
              'package_id': 'https://raw.githubusercontent.com/h2ostudiochile/h2o-ia-site-migrator/main/bootstrap/package.sha256',
              'package_sha256': sha,
              'parts': parts,
              'tested': '7.1',
              'requires_php': '8.0',
          }
          release = {
              'version': version,
              'package_url': f'https://github.com/h2ostudiochile/h2o-ia-site-migrator/releases/download/v{version}/h2o-ia-site-migrator-{version}.zip',
              'package_sha256': sha,
              'tested': '7.1',
              'requires_php': '8.0',
          }
          (dist / 'release-bootstrap.json').write_text(json.dumps(bootstrap, indent=2) + '\n')
          (dist / 'release.json').write_text(json.dumps(release, indent=2) + '\n')
          PY

      - name: Upload tested package
        uses: actions/upload-artifact@v4
        with:
          name: h2o-ia-site-migrator-1.0.16-tested
          path: |
            dist-1016/h2o-ia-site-migrator-1.0.16.zip
            dist-1016/release.json
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          PACKAGE="dist-1016/h2o-ia-site-migrator-$VERSION.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" dist-1016/release.json --clobber
          else
            gh release create "$TAG" "$PACKAGE" dist-1016/release.json \
              --target main \
              --title "h2o IA Site Migrator $VERSION" \
              --notes "Templa: tipografía pasa a ser propiedad global de Salient. Incluye preset operador Manrope + logo 62 + Accent #FFC300 + Color Change, sin tocar internals del tema."
          fi

      - name: Publish updater chunks and manifest
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"

          put_file () {
            path="$1"
            file="$2"
            msg="$3"
            encoded="$(base64 -w0 "$file")"
            sha="$(gh api "repos/$REPO/contents/$path?ref=main" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              gh api --method PUT "repos/$REPO/contents/$path" \
                -f message="$msg" -f content="$encoded" -f sha="$sha" -f branch="main" >/dev/null
            else
              gh api --method PUT "repos/$REPO/contents/$path" \
                -f message="$msg" -f content="$encoded" -f branch="main" >/dev/null
            fi
          }

          i=1
          for f in $(find dist-1016/parts -type f -name 'raw-*' | sort); do
            target="$(printf 'bootstrap/%s/part-%02d.b64' "$VERSION" "$i")"
            put_file "$target" "$f" "Site Migrator $VERSION package part $i"
            i=$((i+1))
          done

          put_file "bootstrap/package.sha256" "dist-1016/package.sha256" "Site Migrator $VERSION checksum"
          put_file "bootstrap/release.json" "dist-1016/release-bootstrap.json" "Publish Site Migrator $VERSION updater manifest"
