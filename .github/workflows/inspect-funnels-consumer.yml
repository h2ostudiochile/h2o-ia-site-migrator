name: Inspect 1.0.17 Funnels consumer
on:
  push:
    branches:
      - fix/templa-funnels-1.0.18
    paths:
      - '.github/workflows/inspect-funnels-consumer.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/h2osm117"
          mkdir -p "$WORK"
          cat bootstrap/1.0.17/part-*.b64 | tr -d '\n\r ' | base64 --decode > "$WORK/pkg.zip"
          unzip -q "$WORK/pkg.zip" -d "$WORK/pkg"
          ROOT="$WORK/pkg/h2o-ia-site-migrator"
          echo "=== funnels references ==="
          grep -RniE "Funnels|funnels|funnel_uuid|No fue posible consultar" "$ROOT" | head -n 300 || true
          echo "=== class-funnels.php ==="
          sed -n '1,360p' "$ROOT/includes/class-funnels.php"
          echo "=== files ==="
          find "$ROOT" -maxdepth 3 -type f | sort
