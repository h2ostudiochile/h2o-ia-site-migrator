name: Release h2o IA Site Migrator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'bootstrap/trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h2o-ia-site-migrator-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build 1.0.12 strict Salient-native fix
        shell: bash
        run: |
          set -Euo pipefail
          trap 'rc=$?; printf "FAILED line %s: %s\n" "$LINENO" "$BASH_COMMAND" > "$GITHUB_WORKSPACE/build-failure.txt"; exit "$rc"' ERR

          BASE_VERSION="1.0.12"
          VERSION="1.0.11"
          WORK="$RUNNER_TEMP/h2osm-$VERSION"
          DIST="$GITHUB_WORKSPACE/dist"

          rm -rf "$WORK" "$DIST"
          mkdir -p "$WORK/current" "$DIST/parts"

          cat bootstrap/$BASE_VERSION/part-*.b64 | tr -d '\n\r ' | base64 --decode > "$WORK/current.zip"
          unzip -q "$WORK/current.zip" -d "$WORK/current"
          ROOT="$WORK/current/h2o-ia-site-migrator"

          cat > "$ROOT/includes/class-salient-setup.php" <<'PHP'
          <?php
          namespace H2O\Site_Migrator;

          if ( ! defined( 'ABSPATH' ) ) {
              exit;
          }

          final class Salient_Setup {
              private const LOGO_URL = 'https://templadesign.cl/wp-content/uploads/2025/04/TEMPLA_BLACKsm.png';

              public static function register(): void {
                  add_action( 'init', array( self::class, 'maybe_configure' ), 100 );
              }

              public static function maybe_configure(): void {
                  $profile = Registry::current_profile();
                  if ( ! is_array( $profile ) || 'templa-design' !== (string) ( $profile['key'] ?? '' ) ) {
                      return;
                  }
                  self::configure();
              }

              public static function configure(): void {
                  self::configure_header();
                  self::configure_primary_menu();
              }

              private static function configure_header(): void {
                  $options = get_option( 'salient_redux', array() );
                  $options = is_array( $options ) ? $options : array();

                  $logo_id = (int) attachment_url_to_postid( self::LOGO_URL );
                  $logo_url = self::LOGO_URL;
                  $logo_width = 0;
                  $logo_height_px = 0;
                  if ( $logo_id > 0 ) {
                      $logo_src = wp_get_attachment_image_src( $logo_id, 'full' );
                      if ( is_array( $logo_src ) ) {
                          $logo_url = (string) $logo_src[0];
                          $logo_width = (int) $logo_src[1];
                          $logo_height_px = (int) $logo_src[2];
                      }
                  }
                  $logo_media = array(
                      'url'       => esc_url_raw( $logo_url ),
                      'id'        => $logo_id,
                      'height'    => $logo_height_px,
                      'width'     => $logo_width,
                      'thumbnail' => esc_url_raw( $logo_url ),
                  );

                  $options['use-logo']              = '1';
                  $options['logo']                  = $logo_media;
                  $options['mobile-logo']           = $logo_media;
                  $options['logo-height']           = '42';
                  $options['mobile-logo-height']    = '30';
                  $options['header-padding']        = '18';
                  $options['header_format']         = 'default';
                  $options['header-fullwidth']      = '0';
                  $options['header-color']          = 'light';
                  $options['header-background-color'] = '#ffffff';
                  $options['header-disable-search'] = '1';
                  $options['transparent-header']    = '0';
                  $options['header-mobile-fixed']   = '1';
                  $options['header-remove-fixed']   = '0';
                  $options['header-resize-on-scroll'] = '1';
                  $options['header-box-shadow']     = 'small';

                  update_option( 'salient_redux', $options, false );
              }

              private static function configure_primary_menu(): void {
                  $menu = false;
                  foreach ( array( 'Principal', 'Main', 'Main Menu', 'Templa Principal', 'Top Navigation Menu' ) as $name ) {
                      $candidate = wp_get_nav_menu_object( $name );
                      if ( $candidate ) {
                          $menu = $candidate;
                          break;
                      }
                  }

                  if ( ! $menu ) {
                      $menu_id = wp_create_nav_menu( 'Principal' );
                      if ( is_wp_error( $menu_id ) ) {
                          return;
                      }
                      $menu = wp_get_nav_menu_object( (int) $menu_id );
                  }

                  if ( ! $menu ) {
                      return;
                  }

                  $menu_id = (int) $menu->term_id;
                  $existing = wp_get_nav_menu_items( $menu_id );
                  $existing = is_array( $existing ) ? $existing : array();
                  $by_page = array();

                  foreach ( $existing as $item ) {
                      if ( 'page' === (string) ( $item->object ?? '' ) ) {
                          $by_page[ (int) $item->object_id ] = (int) $item->ID;
                      }
                  }

                  $wanted = array(
                      array( 'slug' => 'inicio', 'label' => 'Inicio' ),
                      array( 'slug' => 'quienes-somos', 'label' => 'Quiénes somos' ),
                      array( 'slug' => 'servicios', 'label' => 'Servicios' ),
                      array( 'slug' => 'portafolio', 'label' => 'Portafolio' ),
                      array( 'slug' => 'blog', 'label' => 'Blog' ),
                      array( 'slug' => 'contacto', 'label' => 'Contacto' ),
                  );

                  $position = 1;
                  foreach ( $wanted as $entry ) {
                      $page = get_page_by_path( $entry['slug'], OBJECT, 'page' );
                      if ( ! $page instanceof \WP_Post ) {
                          $position++;
                          continue;
                      }

                      wp_update_nav_menu_item(
                          $menu_id,
                          $by_page[ (int) $page->ID ] ?? 0,
                          array(
                              'menu-item-title'     => $entry['label'],
                              'menu-item-object-id' => (int) $page->ID,
                              'menu-item-object'    => 'page',
                              'menu-item-type'      => 'post_type',
                              'menu-item-status'    => 'publish',
                              'menu-item-position'  => $position,
                          )
                      );
                      $position++;
                  }

                  $locations = get_theme_mod( 'nav_menu_locations', array() );
                  $locations = is_array( $locations ) ? $locations : array();
                  $locations['top_nav'] = $menu_id;
                  set_theme_mod( 'nav_menu_locations', $locations );
              }
          }
          PHP

          python3 - "$ROOT" "$BASE_VERSION" "$VERSION" <<'PY'
          import pathlib, re, sys

          root = pathlib.Path(sys.argv[1])
          base = sys.argv[2]
          version = sys.argv[3]

          main = root / "h2o-ia-site-migrator.php"
          s = main.read_text()
          s = s.replace(f"Version: {base}", f"Version: {version}")
          s = s.replace(f"define( 'H2OSM_VERSION', '{base}' )", f"define( 'H2OSM_VERSION', '{version}' )")
          main.write_text(s)

          plugin = root / "includes/class-plugin.php"
          p = plugin.read_text()
          if "Salient_Setup::register();" not in p:
              p = p.replace("Funnels::register();", "Funnels::register();\n        Salient_Setup::register();")
          plugin.write_text(p)

          sync = root / "includes/class-sync.php"
          q = sync.read_text()
          marker = "        update_option( self::STATE_OPTION, $state, false );"
          if "Salient_Setup::configure();" not in q:
              q = q.replace(marker, marker + "\n\n        Salient_Setup::configure();")
          sync.write_text(q)

          profile = root / "profiles/templa-design.php"
          content = profile.read_text()

          content = content.replace(f"h2o-site-migrator:templa-design:{base}", f"h2o-site-migrator:templa-design:{version}")
          content = content.replace(f'data-h2osm-release="{base}"', f'data-h2osm-release="{version}"')
          content = re.sub(r"'version'\s*=>\s*'[^']+'", f"'version' => '{version}'", content, count=1)

          attr_re = re.compile(r'([A-Za-z0-9_:-]+)="([^"]*)"')

          row_defaults = {
              "full_screen_row_position":"middle",
              "column_margin":"default",
              "column_direction":"default",
              "column_direction_tablet":"default",
              "column_direction_phone":"default",
              "scene_position":"center",
              "text_color":"dark",
              "text_align":"left",
              "row_border_radius":"none",
              "row_border_radius_applies":"bg",
              "overflow":"visible",
              "overlay_strength":"0.3",
              "gradient_direction":"left_to_right",
              "shape_divider_position":"bottom",
              "bg_image_animation":"none",
              "gradient_type":"default",
              "shape_type":"",
          }

          col_defaults = {
              "column_padding":"no-extra-padding",
              "column_padding_tablet":"inherit",
              "column_padding_phone":"inherit",
              "column_padding_position":"all",
              "column_element_direction_desktop":"default",
              "column_element_spacing":"default",
              "desktop_text_alignment":"default",
              "tablet_text_alignment":"default",
              "phone_text_alignment":"default",
              "background_color_opacity":"1",
              "background_hover_color_opacity":"1",
              "column_backdrop_filter":"none",
              "column_shadow":"none",
              "column_border_radius":"none",
              "column_link_target":"_self",
              "column_position":"default",
              "gradient_direction":"left_to_right",
              "overlay_strength":"0.3",
              "width":"1/1",
              "tablet_width_inherit":"default",
              "animation_type":"default",
              "bg_image_animation":"none",
              "border_type":"simple",
              "column_border_width":"none",
              "column_border_style":"solid",
              "column_padding_type":"default",
              "gradient_type":"default",
          }

          css_text = (root / "assets/frontend.css").read_text()
          def css_var(name, fallback):
              m = re.search(r'--' + re.escape(name) + r'\s*:\s*([^;]+);', css_text)
              return m.group(1).strip() if m else fallback
          black = css_var("h2osm-black", "#171717")
          cream = css_var("h2osm-cream", "#f4f0e7")

          def attrs_to_dict(raw):
              return {k:v for k,v in attr_re.findall(raw)}

          def attrs_to_string(attrs):
              return " ".join(f'{k}="{v}"' for k,v in attrs.items())

          def normalize_row(m):
              attrs = attrs_to_dict(m.group(1))
              for k,v in row_defaults.items():
                  attrs.setdefault(k,v)
              row_type = attrs.get("type","in_container")
              cls = attrs.get("el_class","")

              if "h2osm-hero-row" in cls or "h2osm-visual-row" in cls:
                  attrs["type"] = "full_width_content"
                  attrs["text_color"] = "light"
                  attrs["bg_position"] = attrs.get("bg_position") or "center center"
                  attrs["bg_repeat"] = attrs.get("bg_repeat") or "no-repeat"
                  attrs["scene_position"] = "center"
                  attrs["overlay_strength"] = attrs.get("overlay_strength") or "0.3"
              elif row_type == "full_width_background":
                  attrs["type"] = "full_width_background"

              if "h2osm-section-dark" in cls:
                  attrs["bg_color"] = black
                  attrs["text_color"] = "light"
              elif "h2osm-section-cream" in cls:
                  attrs["bg_color"] = cream
                  attrs["text_color"] = "dark"

              if "h2osm-section" in cls and "top_padding" not in attrs:
                  attrs["top_padding"] = "6%"
                  attrs["bottom_padding"] = "6%"

              return "[vc_row " + attrs_to_string(attrs) + "]"

          def normalize_col(m):
              attrs = attrs_to_dict(m.group(1))
              for k,v in col_defaults.items():
                  attrs.setdefault(k,v)
              return "[vc_column " + attrs_to_string(attrs) + "]"

          content = re.sub(r'\[vc_row([^\]]*)\]', normalize_row, content)
          content = re.sub(r'\[vc_column([^\]]*)\]', normalize_col, content)

          # Remove structurally empty rows/columns.
          previous = None
          while previous != content:
              previous = content
              content = re.sub(r'\[vc_row[^\]]*\]\s*\[vc_column[^\]]*\]\s*\[/vc_column\]\s*\[/vc_row\]', '', content, flags=re.S)
              content = re.sub(r'\[vc_row[^\]]*\]\s*\[/vc_row\]', '', content, flags=re.S)

          profile.write_text(content)

          css = root / "assets/frontend.css"
          c = css.read_text()

          # Strip row-level geometry/background hacks. Salient owns these.
          row_tokens = (
              ".h2osm-fullbleed",
              ".h2osm-hero-row",
              ".h2osm-visual-row",
              ".h2osm-bg-row",
              ".h2osm-site>.h2osm-section",
              ".h2osm-site > .h2osm-section",
              ".h2osm-site>.h2osm-service-grid",
              ".h2osm-site > .h2osm-service-grid",
              ".h2osm-site>.h2osm-project-grid",
              ".h2osm-site > .h2osm-project-grid",
              ".row_col_wrap_12",
          )

          out = []
          pos = 0
          for match in re.finditer(r'([^{}]+)\{([^{}]*)\}', c, re.S):
              out.append(c[pos:match.start()])
              selector = match.group(1)
              body = match.group(2)
              if any(token in selector for token in row_tokens):
                  # Keep no custom rule at all for structural rows.
                  out.append("")
              else:
                  out.append(selector + "{" + body + "}")
              pos = match.end()
          out.append(c[pos:])
          c = "".join(out)

          # Hard guard against the exact hacks that caused cut/off-center rows.
          c = re.sub(r'(?i)width\s*:\s*100vw\s*!?important?\s*;?', '', c)
          c = re.sub(r'(?i)margin-left\s*:\s*calc\([^;]*50vw[^;]*\)\s*!?important?\s*;?', '', c)
          c = re.sub(r'(?i)margin-right\s*:\s*calc\([^;]*50vw[^;]*\)\s*!?important?\s*;?', '', c)
          css.write_text(c)
          PY

          python3 - "$ROOT" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          profile = root / "profiles/templa-design.php"
          p = profile.read_text()

          # Salient row type is the only width authority.
          p = re.sub(r'\s+full_width="stretch_row_content_no_spaces"', '', p)
          p = re.sub(r'\s+full_width="stretch_row"', '', p)
          p = p.replace(' h2osm-fullbleed', '').replace(' h2osm-bg-row', '')

          # Remove safe duplicate closing builder tags; fail on true mis-nesting.
          token_re = re.compile(r'\[(?P<close>/)?(?P<tag>vc_row|vc_column|vc_column_text)(?P<attrs>[^\]]*)\]')
          out, stack, pos = [], [], 0
          for m in token_re.finditer(p):
              out.append(p[pos:m.start()])
              tag = m.group('tag')
              if not m.group('close'):
                  stack.append(tag)
                  out.append(m.group(0))
              elif stack and stack[-1] == tag:
                  stack.pop()
                  out.append(m.group(0))
              elif tag not in stack:
                  # Duplicate closing shortcode: remove it.
                  pass
              else:
                  raise SystemExit(f'BAD_BUILDER_NESTING closing={tag} stack={stack[-8:]}')
              pos = m.end()
          out.append(p[pos:])
          p = ''.join(out)
          if stack:
              raise SystemExit(f'UNCLOSED_BUILDER_TAGS {stack[-8:]}')

          # Remove truly empty rows.
          previous = None
          while previous != p:
              previous = p
              p = re.sub(r'\[vc_row[^\]]*\]\s*\[vc_column[^\]]*\]\s*\[/vc_column\]\s*\[/vc_row\]', '', p, flags=re.S)
              p = re.sub(r'\[vc_row[^\]]*\]\s*\[/vc_row\]', '', p, flags=re.S)

          if '<style' in p.lower():
              raise SystemExit('INLINE_STYLE_BLOCK_IN_BUILDER')

          profile.write_text(p)

          # Structural layout/background CSS is forbidden; Salient owns Rows.
          css = root / "assets/frontend.css"
          s = css.read_text()
          forbidden = (
              '.h2osm-fullbleed',
              '.h2osm-hero-row',
              '.h2osm-visual-row',
              '.h2osm-bg-row',
              '.h2osm-site>.h2osm-section',
              '.h2osm-site > .h2osm-section',
              '.h2osm-site>.h2osm-service-grid',
              '.h2osm-site > .h2osm-service-grid',
              '.h2osm-site>.h2osm-project-grid',
              '.h2osm-site > .h2osm-project-grid',
              '.row_col_wrap_12',
          )
          chunks, pos = [], 0
          for m in re.finditer(r'([^{}]+)\{([^{}]*)\}', s, re.S):
              chunks.append(s[pos:m.start()])
              selector, body = m.group(1), m.group(2)
              chunks.append('' if any(t in selector for t in forbidden) else selector + '{' + body + '}')
              pos = m.end()
          chunks.append(s[pos:])
          s = ''.join(chunks)
          s = re.sub(r'(?i)width\s*:\s*100vw\s*!?important?\s*;?', '', s)
          s = re.sub(r'(?i)margin-(?:left|right)\s*:\s*calc\([^;]*50vw[^;]*\)\s*!?important?\s*;?', '', s)
          css.write_text(s)
          PY

          # Final strict builder validation.
          python3 - "$ROOT/profiles/templa-design.php" <<'PY'
          import pathlib, re, sys
          s = pathlib.Path(sys.argv[1]).read_text()
          token_re = re.compile(r'\[(?P<close>/)?(?P<tag>vc_row|vc_column|vc_column_text)(?:[^\]]*)\]')
          stack=[]
          for m in token_re.finditer(s):
              tag=m.group('tag')
              if not m.group('close'):
                  stack.append(tag)
              else:
                  if not stack or stack[-1] != tag:
                      raise SystemExit(f'BAD_NESTING {tag} {stack[-8:]}')
                  stack.pop()
          if stack:
              raise SystemExit(f'UNCLOSED {stack[-8:]}')
          for row in re.findall(r'\[vc_row[^\]]*\].*?\[/vc_row\]', s, re.S):
              inner=re.sub(r'\[/?vc_column[^\]]*\]|\[/?vc_column_text[^\]]*\]|\[/?vc_row[^\]]*\]','',row)
              inner=re.sub(r'<!--.*?-->','',inner,flags=re.S).strip()
              if not re.sub(r'\s+','',inner):
                  raise SystemExit('EMPTY_ROW')
          print('STRICT_SALIENT_BUILDER_OK')
          PY

          {
            echo "## $VERSION — 2026-10-05"
            echo "- Corrige Header Navigation: el logo Templa se guarda como Redux media real y alimenta los data-* nativos del header."
            echo "- Crea/actualiza el menú Principal y lo asigna a top_nav después de sincronizar las páginas."
            echo "- Normaliza cada vc_row y vc_column con los atributos nativos completos de Salient/WPBakery."
            echo "- Full Width Content y Full Width Background quedan definidos sólo por type, sin stretch_row paralelo ni hacks 100vw."
            echo "- Los fondos oscuros/crema pasan a bg_color de la Row nativa; ya no dependen de CSS estructural."
            echo "- Elimina reglas CSS estructurales que modificaban width, container, backgrounds o row_col_wrap_12."
            echo "- Elimina cierres duplicados de vc_column_text, filas vacías y bloquea el release ante cualquier nesting inválido."
            echo
            cat "$ROOT/CHANGELOG.md"
          } > "$WORK/CHANGELOG.md"
          mv "$WORK/CHANGELOG.md" "$ROOT/CHANGELOG.md"

          php -l "$ROOT/h2o-ia-site-migrator.php" >/dev/null
          php -l "$ROOT/includes/class-plugin.php" >/dev/null
          php -l "$ROOT/includes/class-sync.php" >/dev/null
          php -l "$ROOT/includes/class-salient-setup.php" >/dev/null
          php -l "$ROOT/profiles/templa-design.php" >/dev/null

          grep -q "Version: $VERSION" "$ROOT/h2o-ia-site-migrator.php"
          grep -q "Salient_Setup::configure();" "$ROOT/includes/class-sync.php"
          grep -q "\['top_nav'\] = \$menu_id" "$ROOT/includes/class-salient-setup.php"
          grep -q "TEMPLA_BLACKsm.png" "$ROOT/includes/class-salient-setup.php"
          grep -q "full_screen_row_position=\"middle\"" "$ROOT/profiles/templa-design.php"
          grep -q "column_margin=\"default\"" "$ROOT/profiles/templa-design.php"
          grep -q "row_border_radius=\"none\"" "$ROOT/profiles/templa-design.php"
          grep -q "column_padding=\"no-extra-padding\"" "$ROOT/profiles/templa-design.php"
          ! grep -q 'full_width="stretch_row' "$ROOT/profiles/templa-design.php"
          ! grep -q 'width:100vw' "$ROOT/assets/frontend.css"
          ! grep -q 'row_col_wrap_12' "$ROOT/assets/frontend.css"

          python3 - "$ROOT/profiles/templa-design.php" <<'PY'
          import re, pathlib, sys
          s = pathlib.Path(sys.argv[1]).read_text()
          rows = re.findall(r'\[vc_row[^\]]*\].*?\[/vc_row\]', s, re.S)
          if not rows:
              raise SystemExit('no vc_rows found')
          for row in rows:
              inner = re.sub(r'\[/?vc_column[^\]]*\]|\[/?vc_column_text[^\]]*\]|\[/?vc_row[^\]]*\]', '', row)
              inner = re.sub(r'<!--.*?-->', '', inner, flags=re.S).strip()
              if not re.sub(r'\s+', '', inner):
                  raise SystemExit('empty vc_row found')
          print('SALIENT_ROWS_OK', len(rows))
          PY

          (cd "$WORK/current" && zip -qr "$DIST/h2o-ia-site-migrator-$VERSION.zip" h2o-ia-site-migrator)
          SHA="$(sha256sum "$DIST/h2o-ia-site-migrator-$VERSION.zip" | awk '{print $1}')"
          echo "$SHA" > "$DIST/package.sha256"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          base64 -w0 "$DIST/h2o-ia-site-migrator-$VERSION.zip" > "$DIST/package.b64"
          split -b 5000 -d -a 2 "$DIST/package.b64" "$DIST/parts/raw-"

          node - "$VERSION" "$SHA" <<'NODE'
          const fs = require('fs');
          const [version, sha] = process.argv.slice(2);
          const raw = fs.readdirSync('dist/parts').sort();
          const parts = raw.map((f,i) =>
            'https://raw.githubusercontent.com/h2ostudiochile/h2o-ia-site-migrator/main/bootstrap/' +
            version + '/part-' + String(i + 1).padStart(2,'0') + '.b64'
          );
          fs.writeFileSync('dist/release-bootstrap.json', JSON.stringify({
            version,
            package_id: 'https://raw.githubusercontent.com/h2ostudiochile/h2o-ia-site-migrator/main/bootstrap/package.sha256',
            package_sha256: sha,
            parts,
            tested: '7.1',
            requires_php: '8.0'
          }, null, 2) + '\n');
          fs.writeFileSync('dist/release.json', JSON.stringify({
            version,
            package_url: 'https://github.com/h2ostudiochile/h2o-ia-site-migrator/releases/download/v' + version + '/h2o-ia-site-migrator-' + version + '.zip',
            package_sha256: sha,
            tested: '7.1',
            requires_php: '8.0'
          }, null, 2) + '\n');
          NODE

      - name: Upload build failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-1.0.12
          path: build-failure.txt
          if-no-files-found: ignore

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          PACKAGE="dist/h2o-ia-site-migrator-$VERSION.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" dist/release.json --clobber
          else
            gh release create "$TAG" "$PACKAGE" dist/release.json \
              --target main \
              --title "h2o IA Site Migrator $VERSION" \
              --notes "Corrección estricta Salient: logo Redux media real, menú Principal en top_nav, shortcodes balanceados, filas vacías eliminadas y sin CSS estructural gobernando las Rows."
          fi

      - name: Publish updater chunks and manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"

          put_file () {
            path="$1"
            file="$2"
            msg="$3"
            encoded="$(base64 -w0 "$file")"
            sha="$(gh api "repos/$REPO/contents/$path?ref=main" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              gh api --method PUT "repos/$REPO/contents/$path" \
                -f message="$msg" -f content="$encoded" -f sha="$sha" -f branch="main" >/dev/null
            else
              gh api --method PUT "repos/$REPO/contents/$path" \
                -f message="$msg" -f content="$encoded" -f branch="main" >/dev/null
            fi
          }

          i=1
          for f in $(find dist/parts -type f -name 'raw-*' | sort); do
            target="$(printf 'bootstrap/%s/part-%02d.b64' "$VERSION" "$i")"
            put_file "$target" "$f" "Site Migrator $VERSION package part $i"
            i=$((i+1))
          done

          put_file "bootstrap/package.sha256" "dist/package.sha256" "Site Migrator $VERSION checksum"
          put_file "bootstrap/release.json" "dist/release-bootstrap.json" "Publish Site Migrator $VERSION updater manifest"
