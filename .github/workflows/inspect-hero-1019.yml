name: Inspect 1.0.19 hero pipeline
on:
  push:
    branches:
      - fix/nectar-slider-hero-1.0.20
    paths:
      - '.github/workflows/inspect-hero-1019.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/h2osm119"
          mkdir -p "$WORK"
          cat bootstrap/1.0.19/part-*.b64 | tr -d '\n\r ' | base64 --decode > "$WORK/pkg.zip"
          unzip -q "$WORK/pkg.zip" -d "$WORK/pkg"
          ROOT="$WORK/pkg/h2o-ia-site-migrator"
          echo "=== hero refs ==="
          grep -RniE "hero|h2osm-hero|full_width_content|bg_image|button" "$ROOT" | head -n 500 || true
          echo "=== profile head ==="
          nl -ba "$ROOT/profiles/templa-design.php" | sed -n '1,24p'
          echo "=== sync ==="
          nl -ba "$ROOT/includes/class-sync.php" | sed -n '1,260p'
          echo "=== plugin ==="
          nl -ba "$ROOT/includes/class-plugin.php" | sed -n '1,220p'
          echo "=== profile loader ==="
          grep -RniE "profile|profiles|source_url|source|pages" "$ROOT/includes" | head -n 300 || true
          echo "=== profile tail ==="
          nl -ba "$ROOT/profiles/templa-design.php" | tail -n 160
          echo "=== registry ==="
          nl -ba "$ROOT/includes/class-registry.php" | sed -n '1,260p'
          echo "=== main plugin ==="
          nl -ba "$ROOT/h2o-ia-site-migrator.php" | sed -n '1,260p'
          echo "=== registry ==="
          nl -ba "$ROOT/includes/class-registry.php" | sed -n '1,220p'
          echo "=== files ==="
          find "$ROOT/includes" -maxdepth 1 -type f -print | sort
