name: Release h2o IA Site Migrator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'bootstrap/trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h2o-ia-site-migrator-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build 1.0.6 from current plugin with known-good layout
        shell: bash
        run: |
          set -euo pipefail

          BASE_VERSION="1.0.5"
          VERSION="1.0.6"
          GOOD_REF="1645d5713a9d727138cf66e6cb7480be8564acd6"
          WORK="$RUNNER_TEMP/h2osm-$VERSION"
          DIST="$GITHUB_WORKSPACE/dist"

          rm -rf "$WORK" "$DIST"
          mkdir -p "$WORK/current" "$WORK/good" "$DIST/parts"

          # Rebuild the current 1.0.5 package from immutable chunks.
          cat bootstrap/1.0.5/v2-part-*.b64 | tr -d '\n\r ' | base64 --decode > "$WORK/current.zip"
          unzip -q "$WORK/current.zip" -d "$WORK/current"
          ROOT="$WORK/current/h2o-ia-site-migrator"

          # Rebuild the visually correct 1.0.3 package and restore ONLY its layout CSS.
          for i in 01 02 03; do
            git show "$GOOD_REF:bootstrap/part-$i.b64"
          done | tr -d '\n\r ' | base64 --decode > "$WORK/good.zip"
          unzip -q "$WORK/good.zip" -d "$WORK/good"
          GOOD="$WORK/good/h2o-ia-site-migrator"

          cp "$GOOD/assets/frontend.css" "$ROOT/assets/frontend.css"

          # Keep the Salient/Nectar blog improvement but do not alter row geometry.
          cat >> "$ROOT/assets/frontend.css" <<'CSS'

          /* 1.0.6 — Blog cosmetic layer only.
             Row geometry is delegated to Salient/WPBakery native full-width modes. */
          .h2osm-managed-page .h2osm-salient-blog-row .nectar-post-grid-wrap{
            margin-top:0!important;
          }
          .h2osm-managed-page .h2osm-salient-blog-row .nectar-post-grid-item{
            background:transparent!important;
          }
          .h2osm-managed-page .h2osm-salient-blog-row .nectar-post-grid-item .content{
            padding-top:18px!important;
          }
          .h2osm-managed-page .h2osm-salient-blog-row .nectar-post-grid-item h2,
          .h2osm-managed-page .h2osm-salient-blog-row .nectar-post-grid-item h3{
            letter-spacing:-.035em!important;
          }
          .h2osm-managed-page .h2osm-salient-blog-row .nectar-post-grid-item img{
            transition:transform .45s ease!important;
          }
          CSS

          # Version bump and sync marker bump. Keep the current 1.0.5 profile,
          # including native Salient row types and Nectar Post Grid markup.
          sed -i "s/Version: $BASE_VERSION/Version: $VERSION/" "$ROOT/h2o-ia-site-migrator.php"
          sed -i "s/define( 'H2OSM_VERSION', '$BASE_VERSION' )/define( 'H2OSM_VERSION', '$VERSION' )/" "$ROOT/h2o-ia-site-migrator.php"
          sed -i "s/h2o-site-migrator:templa-design:$BASE_VERSION/h2o-site-migrator:templa-design:$VERSION/g" "$ROOT/profiles/templa-design.php"
          sed -i "s/data-h2osm-release=\"$BASE_VERSION\"/data-h2osm-release=\"$VERSION\"/g" "$ROOT/profiles/templa-design.php"

          {
            echo "## $VERSION — 2026-10-05"
            echo "- Restaura exactamente la geometría CSS de la primera maqueta aprobada."
            echo "- Full Width Content queda reservado a hero, imagen y video."
            echo "- Full Width Background queda delegado al modo nativo de Salient para texto y contenido editorial."
            echo "- Conserva Nectar Post Grid e imágenes destacadas en Blog."
            echo
            cat "$ROOT/CHANGELOG.md"
          } > "$WORK/CHANGELOG.md"
          mv "$WORK/CHANGELOG.md" "$ROOT/CHANGELOG.md"

          # Guard rails: do not publish another geometry override.
          php -l "$ROOT/h2o-ia-site-migrator.php" >/dev/null
          php -l "$ROOT/profiles/templa-design.php" >/dev/null
          grep -q "Version: $VERSION" "$ROOT/h2o-ia-site-migrator.php"
          grep -q 'type="full_width_content" full_width="stretch_row_content_no_spaces"' "$ROOT/profiles/templa-design.php"
          grep -q 'type="full_width_background" el_class="h2osm-section"' "$ROOT/profiles/templa-design.php"
          grep -q 'nectar_post_grid' "$ROOT/profiles/templa-design.php"
          grep -q 'left:50%!important;right:50%!important' "$ROOT/assets/frontend.css"
          ! grep -q 'restore canonical Salient row geometry' "$ROOT/assets/frontend.css"
          ! grep -q 'margin-left:calc(50% - 50vw)' "$ROOT/assets/frontend.css"

          (cd "$WORK/current" && zip -qr "$DIST/h2o-ia-site-migrator-$VERSION.zip" h2o-ia-site-migrator)
          SHA="$(sha256sum "$DIST/h2o-ia-site-migrator-$VERSION.zip" | awk '{print $1}')"
          echo "$SHA" > "$DIST/package.sha256"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_SHA256=$SHA" >> "$GITHUB_ENV"

          base64 -w0 "$DIST/h2o-ia-site-migrator-$VERSION.zip" > "$DIST/package.b64"
          split -b 5000 -d -a 2 "$DIST/package.b64" "$DIST/parts/raw-"

          node - "$VERSION" "$SHA" <<'NODE'
          const fs = require('fs');
          const [version, sha] = process.argv.slice(2);
          const raw = fs.readdirSync('dist/parts').sort();
          const parts = raw.map((f,i) =>
            'https://raw.githubusercontent.com/h2ostudiochile/h2o-ia-site-migrator/main/bootstrap/' +
            version + '/part-' + String(i + 1).padStart(2,'0') + '.b64'
          );
          fs.writeFileSync('dist/release-bootstrap.json', JSON.stringify({
            version,
            package_id: 'https://raw.githubusercontent.com/h2ostudiochile/h2o-ia-site-migrator/main/bootstrap/package.sha256',
            package_sha256: sha,
            parts,
            tested: '7.1',
            requires_php: '8.0'
          }, null, 2) + '\n');
          fs.writeFileSync('dist/release.json', JSON.stringify({
            version,
            package_url: 'https://github.com/h2ostudiochile/h2o-ia-site-migrator/releases/download/v' + version + '/h2o-ia-site-migrator-' + version + '.zip',
            package_sha256: sha,
            tested: '7.1',
            requires_php: '8.0'
          }, null, 2) + '\n');
          NODE

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          PACKAGE="dist/h2o-ia-site-migrator-$VERSION.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" dist/release.json --clobber
          else
            gh release create "$TAG" "$PACKAGE" dist/release.json \
              --target main \
              --title "h2o IA Site Migrator $VERSION" \
              --notes "Restaura la geometría de la primera maqueta aprobada: Full Width Content sólo para hero/visuales; Full Width Background nativo de Salient para contenido editorial. Mantiene Nectar Post Grid en Blog."
          fi

      - name: Publish updater chunks and manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"

          put_file () {
            path="$1"
            file="$2"
            msg="$3"
            encoded="$(base64 -w0 "$file")"
            sha="$(gh api "repos/$REPO/contents/$path?ref=main" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              gh api --method PUT "repos/$REPO/contents/$path" \
                -f message="$msg" -f content="$encoded" -f sha="$sha" -f branch="main" >/dev/null
            else
              gh api --method PUT "repos/$REPO/contents/$path" \
                -f message="$msg" -f content="$encoded" -f branch="main" >/dev/null
            fi
          }

          i=1
          for f in $(find dist/parts -type f -name 'raw-*' | sort); do
            target="$(printf 'bootstrap/%s/part-%02d.b64' "$VERSION" "$i")"
            put_file "$target" "$f" "Site Migrator $VERSION package part $i"
            i=$((i+1))
          done

          put_file "bootstrap/package.sha256" "dist/package.sha256" "Site Migrator $VERSION checksum"
          put_file "bootstrap/release.json" "dist/release-bootstrap.json" "Publish Site Migrator $VERSION updater manifest"
