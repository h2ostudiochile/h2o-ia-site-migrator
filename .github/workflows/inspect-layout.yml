name: Inspect 1.0.12 rendered inputs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-layout.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect CSS and service rows
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/h2osm112
          mkdir -p /tmp/h2osm112
          cat bootstrap/1.0.12/part-*.b64 | tr -d '\n\r ' | base64 --decode > /tmp/h2osm112.zip
          unzip -q /tmp/h2osm112.zip -d /tmp/h2osm112
          ROOT="/tmp/h2osm112/h2o-ia-site-migrator"
          echo '=== CSS ==='
          cat "$ROOT/assets/frontend.css"
          echo '=== SERVICE ROWS ==='
          grep -n '\[vc_row' "$ROOT/profiles/templa-design.php" | head -n 80
          echo '=== SERVICE SECTION ==='
          grep -n -A45 -B8 '\$servicios' "$ROOT/profiles/templa-design.php" | head -n 120
