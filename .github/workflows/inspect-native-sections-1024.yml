name: Inspect 1.0.24 Salient section structure
on:
  push:
    branches:
      - fix/native-salient-sections-1.0.25
    paths:
      - '.github/workflows/inspect-native-sections-1024.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/h2osm1024"
          mkdir -p "$WORK"
          cat bootstrap/1.0.24/part-*.b64 | tr -d '\n\r ' | base64 --decode > "$WORK/pkg.zip"
          unzip -q "$WORK/pkg.zip" -d "$WORK/pkg"
          ROOT="$WORK/pkg/h2o-ia-site-migrator"
          echo "=== profile snippets ==="
          grep -n -C 3 -E 'vc_column_text|vc_row|h2osm-eyebrow|h2osm-|<h[1-6]|Servicios|Quiénes somos|Una mirada integral' "$ROOT/profiles/templa-design.php" | head -n 900 || true
          echo "=== profile classes ==="
          grep -oE 'class="[^"]+"|el_class="[^"]+"' "$ROOT/profiles/templa-design.php" | sort -u || true
          echo "=== nested structural shortcodes inside text blocks ==="
          python3 - "$ROOT/profiles/templa-design.php" <<'PY'
          import pathlib,re,sys
          s=pathlib.Path(sys.argv[1]).read_text()
          for m in re.finditer(r'\[vc_column_text\b[^\]]*\](.*?)\[/vc_column_text\]',s,re.S|re.I):
              body=m.group(1)
              if re.search(r'\[(?:vc_row|vc_column|vc_row_inner|vc_column_inner)\b',body,re.I):
                  print('NESTED_TEXT_BLOCK:',body[:1600].replace('\n',' '))
          PY
