name: Release h2o IA Site Migrator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'bootstrap/trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h2o-ia-site-migrator-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build 1.0.13 clean Salient baseline
        shell: bash
        run: |
          set -Euo pipefail
          trap 'rc=$?; printf "FAILED line %s: %s\n" "$LINENO" "$BASH_COMMAND" > "$GITHUB_WORKSPACE/build-failure.txt"; exit "$rc"' ERR

          BASE_VERSION="1.0.9"
          VERSION="1.0.13"
          WORK="$RUNNER_TEMP/h2osm-$VERSION"
          DIST="$GITHUB_WORKSPACE/dist"

          rm -rf "$WORK" "$DIST"
          mkdir -p "$WORK/current" "$DIST/parts"

          cat bootstrap/$BASE_VERSION/part-*.b64 | tr -d '\n\r ' | base64 --decode > "$WORK/current.zip"
          unzip -q "$WORK/current.zip" -d "$WORK/current"
          ROOT="$WORK/current/h2o-ia-site-migrator"

          cat > "$ROOT/includes/class-salient-setup.php" <<'PHP'
          <?php
          namespace H2O\Site_Migrator;

          if ( ! defined( 'ABSPATH' ) ) {
              exit;
          }

          final class Salient_Setup {
              private const LOGO_URL = 'https://templadesign.cl/wp-content/uploads/2025/04/TEMPLA_BLACKsm.png';

              public static function register(): void {
                  add_action( 'wp_loaded', array( self::class, 'maybe_configure' ), 20 );
              }

              public static function maybe_configure(): void {
                  $profile = Registry::current_profile();
                  if ( ! is_array( $profile ) || 'templa-design' !== (string) ( $profile['key'] ?? '' ) ) {
                      return;
                  }
                  self::configure();
              }

              public static function configure(): void {
                  self::configure_header_navigation();
                  self::configure_primary_menu();
              }

              private static function configure_header_navigation(): void {
                  $options = get_option( 'salient_redux', array() );
                  $options = is_array( $options ) ? $options : array();

                  $logo_id = (int) attachment_url_to_postid( self::LOGO_URL );
                  $logo_url = self::LOGO_URL;
                  $logo_width = 0;
                  $logo_height = 0;

                  if ( $logo_id > 0 ) {
                      $src = wp_get_attachment_image_src( $logo_id, 'full' );
                      if ( is_array( $src ) ) {
                          $logo_url = (string) $src[0];
                          $logo_width = (int) $src[1];
                          $logo_height = (int) $src[2];
                      }
                  }

                  $logo = array(
                      'url'       => esc_url_raw( $logo_url ),
                      'id'        => $logo_id,
                      'height'    => $logo_height,
                      'width'     => $logo_width,
                      'thumbnail' => esc_url_raw( $logo_url ),
                  );

                  $desired = array(
                      'use-logo'                 => '1',
                      'logo'                     => $logo,
                      'mobile-logo'              => $logo,
                      'logo-height'              => '42',
                      'mobile-logo-height'       => '30',
                      'header-padding'           => '18',
                      'header_format'            => 'default',
                      'header-fullwidth'         => '0',
                      'header-color'             => 'light',
                      'header-background-color'  => '#ffffff',
                      'header-disable-search'    => '1',
                      'transparent-header'       => '0',
                      'header-mobile-fixed'      => '1',
                      'header-remove-fixed'      => '0',
                      'header-resize-on-scroll'  => '1',
                      'header-box-shadow'        => 'small',
                  );

                  foreach ( $desired as $key => $value ) {
                      $options[ $key ] = $value;
                  }

                  // Persist first. This guarantees Theme Options -> Header Navigation
                  // shows the actual logo and values even if Redux is not initialized yet.
                  update_option( 'salient_redux', $options, false );

                  // Keep Salient's in-memory options in sync for this same request.
                  global $nectar_options;
                  if ( is_array( $nectar_options ) ) {
                      $nectar_options = array_replace( $nectar_options, $desired );
                  }

                  // If Redux is already loaded, update its runtime store as well.
                  if ( class_exists( '\Redux' ) ) {
                      foreach ( $desired as $key => $value ) {
                          if ( method_exists( '\Redux', 'set_option' ) ) {
                              \Redux::set_option( 'salient_redux', $key, $value );
                          } elseif ( method_exists( '\Redux', 'setOption' ) ) {
                              \Redux::setOption( 'salient_redux', $key, $value );
                          }
                      }
                  }
              }

              private static function configure_primary_menu(): void {
                  $menu = false;
                  foreach ( array( 'Principal', 'Main', 'Main Menu', 'Templa Principal', 'Top Navigation Menu' ) as $name ) {
                      $candidate = wp_get_nav_menu_object( $name );
                      if ( $candidate ) {
                          $menu = $candidate;
                          break;
                      }
                  }

                  if ( ! $menu ) {
                      $menu_id = wp_create_nav_menu( 'Principal' );
                      if ( is_wp_error( $menu_id ) ) {
                          return;
                      }
                      $menu = wp_get_nav_menu_object( (int) $menu_id );
                  }
                  if ( ! $menu ) {
                      return;
                  }

                  $menu_id = (int) $menu->term_id;
                  $existing = wp_get_nav_menu_items( $menu_id );
                  $existing = is_array( $existing ) ? $existing : array();
                  $by_page = array();

                  foreach ( $existing as $item ) {
                      if ( 'page' === (string) ( $item->object ?? '' ) ) {
                          $by_page[ (int) $item->object_id ] = (int) $item->ID;
                      }
                  }

                  $wanted = array(
                      array( 'slug' => 'inicio', 'label' => 'Inicio' ),
                      array( 'slug' => 'quienes-somos', 'label' => 'Quiénes somos' ),
                      array( 'slug' => 'servicios', 'label' => 'Servicios' ),
                      array( 'slug' => 'portafolio', 'label' => 'Portafolio' ),
                      array( 'slug' => 'blog', 'label' => 'Blog' ),
                      array( 'slug' => 'contacto', 'label' => 'Contacto' ),
                  );

                  $position = 1;
                  foreach ( $wanted as $entry ) {
                      $page = get_page_by_path( $entry['slug'], OBJECT, 'page' );
                      if ( ! $page instanceof \WP_Post ) {
                          $position++;
                          continue;
                      }

                      $saved = wp_update_nav_menu_item(
                          $menu_id,
                          $by_page[ (int) $page->ID ] ?? 0,
                          array(
                              'menu-item-title'     => $entry['label'],
                              'menu-item-object-id' => (int) $page->ID,
                              'menu-item-object'    => 'page',
                              'menu-item-type'      => 'post_type',
                              'menu-item-status'    => 'publish',
                              'menu-item-position'  => $position,
                          )
                      );
                      if ( ! is_wp_error( $saved ) ) {
                          $by_page[ (int) $page->ID ] = (int) $saved;
                      }
                      $position++;
                  }

                  $locations = get_theme_mod( 'nav_menu_locations', array() );
                  $locations = is_array( $locations ) ? $locations : array();
                  $locations['top_nav'] = $menu_id;
                  set_theme_mod( 'nav_menu_locations', $locations );
              }
          }
          PHP

          python3 - "$ROOT" "$BASE_VERSION" "$VERSION" <<'PY'
          import pathlib, re, sys

          root = pathlib.Path(sys.argv[1])
          base = sys.argv[2]
          version = sys.argv[3]

          main = root / 'h2o-ia-site-migrator.php'
          s = main.read_text()
          s = s.replace(f'Version: {base}', f'Version: {version}')
          s = s.replace(f"define( 'H2OSM_VERSION', '{base}' )", f"define( 'H2OSM_VERSION', '{version}' )")
          needle = "require_once H2OSM_DIR . 'includes/class-plugin.php';"
          if "includes/class-salient-setup.php" not in s:
              s = s.replace(needle, "require_once H2OSM_DIR . 'includes/class-salient-setup.php';\n" + needle)
          main.write_text(s)

          plugin = root / 'includes/class-plugin.php'
          s = plugin.read_text()
          if 'Salient_Setup::register();' not in s:
              s = s.replace('Funnels::register();', 'Funnels::register();\n        Salient_Setup::register();')
          # Absolutely no Site Migrator stylesheet on the frontend.
          s = re.sub(r"\n\s*add_action\(\s*'wp_enqueue_scripts'.*?\);", '', s, count=1)
          plugin.write_text(s)

          sync = root / 'includes/class-sync.php'
          s = sync.read_text()
          marker = "        update_option( self::STATE_OPTION, $state, false );"
          if 'Salient_Setup::configure();' not in s:
              s = s.replace(marker, marker + "\n\n        Salient_Setup::configure();")
          sync.write_text(s)

          profile = root / 'profiles/templa-design.php'
          p = profile.read_text()
          p = p.replace(f'h2o-site-migrator:templa-design:{base}', f'h2o-site-migrator:templa-design:{version}')
          p = p.replace(f'data-h2osm-release="{base}"', f'data-h2osm-release="{version}"')
          p = re.sub(r"'version'\s*=>\s*'[^']+'", f"'version' => '{version}'", p, count=1)

          # Salient alone owns the width mode.
          p = re.sub(r'\s+full_width="stretch_row_content_no_spaces"', '', p)
          p = re.sub(r'\s+full_width="stretch_row"', '', p)

          # Convert legacy hero wrappers into native Salient row backgrounds.
          def hero_repl(m):
              image = m.group(1)
              body = m.group(2).strip()
              return (
                  '[vc_row type="full_width_content" bg_image="' + image +
                  '" bg_position="center center" bg_repeat="no-repeat" scene_position="center" '
                  'text_color="light" text_align="left" top_padding="14%" bottom_padding="14%" '
                  'overlay_strength="0.35"][vc_column column_padding="padding-8-percent" '
                  'column_padding_position="left-right"][vc_column_text]' + body +
                  '[/vc_column_text][/vc_column][/vc_row]'
              )

          p = re.sub(
              r'\[vc_row[^\]]*el_class="h2osm-hero-row"[^\]]*\]\[vc_column[^\]]*\]\[vc_column_text[^\]]*\]\s*'
              r'<section class="h2osm-hero" style="--h2osm-bg:url\(\'([^\']+)\'\)">\s*'
              r'<div class="h2osm-hero-overlay"></div>\s*<div class="h2osm-hero-copy">(.*?)</div>\s*</section>\s*'
              r'\[/vc_column_text\]\[/vc_column\]\[/vc_row\]',
              hero_repl,
              p,
              flags=re.S
          )

          def visual_repl(m):
              image = m.group(1)
              body = m.group(2).strip()
              return (
                  '[vc_row type="full_width_content" bg_image="' + image +
                  '" bg_position="center center" bg_repeat="no-repeat" scene_position="center" '
                  'text_color="light" text_align="left" top_padding="10%" bottom_padding="10%" '
                  'overlay_strength="0.35"][vc_column column_padding="padding-8-percent" '
                  'column_padding_position="left-right"][vc_column_text]' + body +
                  '[/vc_column_text][/vc_column][/vc_row]'
              )

          p = re.sub(
              r'\[vc_row[^\]]*el_class="h2osm-visual-row"[^\]]*\]\[vc_column[^\]]*\]\[vc_column_text[^\]]*\]'
              r'<section class="h2osm-subhero" style="--h2osm-bg:url\(\'([^\']+)\'\)">'
              r'<div class="h2osm-hero-overlay"></div><div>(.*?)</div></section>'
              r'\[/vc_column_text\]\[/vc_column\]\[/vc_row\]',
              visual_repl,
              p,
              flags=re.S
          )

          # Native row backgrounds/padding based on semantic classes.
          def row_attrs(m):
              raw = m.group(1)
              attrs = dict(re.findall(r'([A-Za-z0-9_:-]+)="([^"]*)"', raw))
              cls = attrs.get('el_class','')
              attrs.setdefault('full_screen_row_position','middle')
              attrs.setdefault('column_margin','default')
              attrs.setdefault('column_direction','default')
              attrs.setdefault('column_direction_tablet','default')
              attrs.setdefault('column_direction_phone','default')
              attrs.setdefault('scene_position','center')
              attrs.setdefault('text_color','dark')
              attrs.setdefault('text_align','left')
              attrs.setdefault('row_border_radius','none')
              attrs.setdefault('row_border_radius_applies','bg')
              attrs.setdefault('overflow','visible')
              attrs.setdefault('overlay_strength','0.3')
              attrs.setdefault('gradient_direction','left_to_right')
              attrs.setdefault('shape_divider_position','bottom')
              attrs.setdefault('bg_image_animation','none')
              attrs.setdefault('gradient_type','default')

              if 'h2osm-section-dark' in cls:
                  attrs['bg_color'] = '#0C0C0C'
                  attrs['text_color'] = 'light'
              elif 'h2osm-section-cream' in cls:
                  attrs['bg_color'] = '#FDFAF3'
              elif 'h2osm-ticker-row' in cls or 'h2osm-cta-row' in cls:
                  attrs['bg_color'] = '#FFC300'

              if attrs.get('type') == 'full_width_background' and 'top_padding' not in attrs:
                  attrs['top_padding'] = '6%'
                  attrs['bottom_padding'] = '6%'

              return '[vc_row ' + ' '.join(f'{k}="{v}"' for k,v in attrs.items()) + ']'

          p = re.sub(r'\[vc_row(?!_inner)([^\]]*)\]', row_attrs, p)

          # IMPORTANT: exact vc_column only. Never match vc_column_text.
          def col_attrs(m):
              raw = m.group(1)
              attrs = dict(re.findall(r'([A-Za-z0-9_:-]+)="([^"]*)"', raw))
              attrs.setdefault('column_padding','no-extra-padding')
              attrs.setdefault('column_padding_tablet','inherit')
              attrs.setdefault('column_padding_phone','inherit')
              attrs.setdefault('column_padding_position','all')
              attrs.setdefault('column_element_direction_desktop','default')
              attrs.setdefault('column_element_spacing','default')
              attrs.setdefault('desktop_text_alignment','default')
              attrs.setdefault('tablet_text_alignment','default')
              attrs.setdefault('phone_text_alignment','default')
              attrs.setdefault('background_color_opacity','1')
              attrs.setdefault('background_hover_color_opacity','1')
              attrs.setdefault('column_backdrop_filter','none')
              attrs.setdefault('column_shadow','none')
              attrs.setdefault('column_border_radius','none')
              attrs.setdefault('column_link_target','_self')
              attrs.setdefault('column_position','default')
              attrs.setdefault('gradient_direction','left_to_right')
              attrs.setdefault('overlay_strength','0.3')
              attrs.setdefault('tablet_width_inherit','default')
              attrs.setdefault('animation_type','default')
              attrs.setdefault('bg_image_animation','none')
              attrs.setdefault('border_type','simple')
              attrs.setdefault('column_border_width','none')
              attrs.setdefault('column_border_style','solid')
              attrs.setdefault('column_padding_type','default')
              attrs.setdefault('gradient_type','default')
              attrs.setdefault('width','1/1')
              return '[vc_column ' + ' '.join(f'{k}="{v}"' for k,v in attrs.items()) + ']'

          p = re.sub(r'\[vc_column(?!_text)([^\]]*)\]', col_attrs, p)

          # Repair legacy duplicates/misnesting without changing content.
          token_re = re.compile(r'\[(?P<close>/)?(?P<tag>vc_column_text|vc_column|vc_row)(?P<attrs>[^\]]*)\]')
          out, stack, pos = [], [], 0
          for m in token_re.finditer(p):
              out.append(p[pos:m.start()])
              tag = m.group('tag')
              if not m.group('close'):
                  stack.append(tag)
                  out.append(m.group(0))
              elif stack and stack[-1] == tag:
                  stack.pop()
                  out.append(m.group(0))
              elif tag not in stack:
                  # Duplicate close from a legacy pass.
                  pass
              else:
                  while stack and stack[-1] != tag:
                      inner = stack.pop()
                      out.append(f'[/{inner}]')
                  if stack and stack[-1] == tag:
                      stack.pop()
                      out.append(m.group(0))
              pos = m.end()
          out.append(p[pos:])
          p = ''.join(out)
          if stack:
              while stack:
                  p += f'[/{stack.pop()}]'

          # Remove true empty rows only.
          previous = None
          while previous != p:
              previous = p
              p = re.sub(r'\[vc_row[^\]]*\]\s*\[vc_column[^\]]*\]\s*\[/vc_column\]\s*\[/vc_row\]', '', p, flags=re.S)
              p = re.sub(r'\[vc_row[^\]]*\]\s*\[/vc_row\]', '', p, flags=re.S)

          profile.write_text(p)

          # Site Migrator must not override Salient layout/header/footer CSS.
          (root / 'assets/frontend.css').write_text(
              '/* h2o IA Site Migrator 1.0.13: no structural CSS. Salient owns layout, header, footer and row geometry. */\n'
          )
          PY

          {
            echo "## $VERSION — 2026-10-05"
            echo "- Reconstruye desde 1.0.9 para eliminar la corrupción introducida al confundir vc_column_text con vc_column."
            echo "- Corrige el parser: vc_column y vc_column_text se tratan como shortcodes distintos."
            echo "- No encola CSS propio del Site Migrator. Salient controla header, footer, filas, fondos y containers."
            echo "- Header Navigation recibe el logo como media Redux persistida y sincronizada en memoria."
            echo "- Menú Principal se crea/actualiza y se asigna a top_nav después de crear las páginas."
            echo "- Hero y subhero usan background nativo de vc_row Full Width Content."
            echo "- Filas editoriales usan Full Width Background y bg_color/padding nativos."
            echo "- Mantiene Funnels por HTTP público y Nectar Post Grid."
            echo
            cat "$ROOT/CHANGELOG.md"
          } > "$WORK/CHANGELOG.md"
          mv "$WORK/CHANGELOG.md" "$ROOT/CHANGELOG.md"

          php -l "$ROOT/h2o-ia-site-migrator.php" >/dev/null
          php -l "$ROOT/includes/class-plugin.php" >/dev/null
          php -l "$ROOT/includes/class-sync.php" >/dev/null
          php -l "$ROOT/includes/class-salient-setup.php" >/dev/null
          php -l "$ROOT/profiles/templa-design.php" >/dev/null

          grep -q "Version: $VERSION" "$ROOT/h2o-ia-site-migrator.php"
          ! grep -q "wp_enqueue_scripts.*enqueue_assets" "$ROOT/includes/class-plugin.php"
          grep -q "\['top_nav'\] = \$menu_id" "$ROOT/includes/class-salient-setup.php"
          grep -q "update_option( 'salient_redux'" "$ROOT/includes/class-salient-setup.php"
          grep -q '\[vc_column_text\]' "$ROOT/profiles/templa-design.php"
          ! grep -q 'full_width="stretch_row' "$ROOT/profiles/templa-design.php"
          ! grep -q 'display:none' "$ROOT/assets/frontend.css"

          python3 - "$ROOT/profiles/templa-design.php" <<'PY'
          import pathlib, re, sys
          s = pathlib.Path(sys.argv[1]).read_text()
          token_re = re.compile(r'\[(?P<close>/)?(?P<tag>vc_column_text|vc_column|vc_row)(?:[^\]]*)\]')
          stack=[]
          for m in token_re.finditer(s):
              tag=m.group('tag')
              if not m.group('close'):
                  stack.append(tag)
              else:
                  if not stack or stack[-1] != tag:
                      raise SystemExit(f'BAD_NESTING {tag} stack={stack[-8:]}')
                  stack.pop()
          if stack:
              raise SystemExit(f'UNCLOSED {stack[-8:]}')

          if re.search(r'\[vc_column(?!_text)[^\]]*\]\s*\[vc_column(?!_text)', s):
              raise SystemExit('DIRECT_NESTED_VC_COLUMN')

          for row in re.findall(r'\[vc_row[^\]]*\].*?\[/vc_row\]', s, re.S):
              inner = re.sub(r'\[/?vc_column(?:_text)?[^\]]*\]|\[/?vc_row[^\]]*\]', '', row)
              inner = re.sub(r'<!--.*?-->', '', inner, flags=re.S).strip()
              if not re.sub(r'\s+', '', inner):
                  raise SystemExit('EMPTY_ROW')

          print('CLEAN_SALIENT_1013_OK')
          PY

          (cd "$WORK/current" && zip -qr "$DIST/h2o-ia-site-migrator-$VERSION.zip" h2o-ia-site-migrator)
          SHA="$(sha256sum "$DIST/h2o-ia-site-migrator-$VERSION.zip" | awk '{print $1}')"
          echo "$SHA" > "$DIST/package.sha256"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          base64 -w0 "$DIST/h2o-ia-site-migrator-$VERSION.zip" > "$DIST/package.b64"
          split -b 5000 -d -a 2 "$DIST/package.b64" "$DIST/parts/raw-"

          node - "$VERSION" "$SHA" <<'NODE'
          const fs = require('fs');
          const [version, sha] = process.argv.slice(2);
          const raw = fs.readdirSync('dist/parts').sort();
          const parts = raw.map((f,i) =>
            'https://raw.githubusercontent.com/h2ostudiochile/h2o-ia-site-migrator/main/bootstrap/' +
            version + '/part-' + String(i + 1).padStart(2,'0') + '.b64'
          );
          fs.writeFileSync('dist/release-bootstrap.json', JSON.stringify({
            version,
            package_id: 'https://raw.githubusercontent.com/h2ostudiochile/h2o-ia-site-migrator/main/bootstrap/package.sha256',
            package_sha256: sha,
            parts,
            tested: '7.1',
            requires_php: '8.0'
          }, null, 2) + '\n');
          fs.writeFileSync('dist/release.json', JSON.stringify({
            version,
            package_url: 'https://github.com/h2ostudiochile/h2o-ia-site-migrator/releases/download/v' + version + '/h2o-ia-site-migrator-' + version + '.zip',
            package_sha256: sha,
            tested: '7.1',
            requires_php: '8.0'
          }, null, 2) + '\n');
          NODE

      - name: Upload build failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-1.0.13
          path: build-failure.txt
          if-no-files-found: ignore

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          PACKAGE="dist/h2o-ia-site-migrator-$VERSION.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" dist/release.json --clobber
          else
            gh release create "$TAG" "$PACKAGE" dist/release.json \
              --target main \
              --title "h2o IA Site Migrator $VERSION" \
              --notes "Reconstrucción limpia Salient: sin CSS estructural del migrador, sin corrupción vc_column_text, Header Navigation con logo persistido, menú Principal en top_nav y Rows nativas."
          fi

      - name: Publish updater chunks and manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"

          put_file () {
            path="$1"
            file="$2"
            msg="$3"
            encoded="$(base64 -w0 "$file")"
            sha="$(gh api "repos/$REPO/contents/$path?ref=main" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              gh api --method PUT "repos/$REPO/contents/$path" \
                -f message="$msg" -f content="$encoded" -f sha="$sha" -f branch="main" >/dev/null
            else
              gh api --method PUT "repos/$REPO/contents/$path" \
                -f message="$msg" -f content="$encoded" -f branch="main" >/dev/null
            fi
          }

          i=1
          for f in $(find dist/parts -type f -name 'raw-*' | sort); do
            target="$(printf 'bootstrap/%s/part-%02d.b64' "$VERSION" "$i")"
            put_file "$target" "$f" "Site Migrator $VERSION package part $i"
            i=$((i+1))
          done

          put_file "bootstrap/package.sha256" "dist/package.sha256" "Site Migrator $VERSION checksum"
          put_file "bootstrap/release.json" "dist/release-bootstrap.json" "Publish Site Migrator $VERSION updater manifest"
