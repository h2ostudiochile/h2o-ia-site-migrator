name: Inspect live hero
on:
  push:
    branches:
      - fix/nectar-slider-hero-1.0.20
    paths:
      - '.github/workflows/inspect-live-hero.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          curl -L --compressed -A 'Mozilla/5.0 H2O Site Migrator audit' --max-time 20 https://templadesign.cl/ -o /tmp/templa.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('/tmp/templa.html').read_text(errors='ignore')
          print('=== hero markers ===')
          for m in re.finditer(r'(et_pb_slide|et_pb_slider|swiper-slide|carousel|Creamos entornos)', html, re.I):
              a=max(0,m.start()-240); b=min(len(html),m.start()+1200)
              print(html[a:b].replace('\n',' ')[:1500])
              print('---')
          print('=== images ===')
          urls=[]
          for u in re.findall(r'https?://[^"\'\s)]+\.(?:webp|jpe?g|png)', html, re.I):
              if u not in urls:
                  urls.append(u)
          for u in urls[:120]:
              print(u)
          print('=== backgrounds ===')
          for x in re.findall(r'background-image\s*:\s*url\(([^)]+)\)', html, re.I):
              print(x.strip('"\' '))
          PY
