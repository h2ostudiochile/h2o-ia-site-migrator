name: Release h2o IA Site Migrator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'bootstrap/trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h2o-ia-site-migrator-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build 1.0.12 strict Salient-native fix
        shell: bash
        run: |
          set -euo pipefail

          BASE_VERSION="1.0.11"
          VERSION="1.0.12"
          WORK="$RUNNER_TEMP/h2osm-$VERSION"
          DIST="$GITHUB_WORKSPACE/dist"

          rm -rf "$WORK" "$DIST"
          mkdir -p "$WORK/current" "$DIST/parts"

          cat bootstrap/$BASE_VERSION/part-*.b64 | tr -d '\n\r ' | base64 --decode > "$WORK/current.zip"
          unzip -q "$WORK/current.zip" -d "$WORK/current"
          ROOT="$WORK/current/h2o-ia-site-migrator"

          cat > "$ROOT/includes/class-salient-setup.php" <<'PHP'
          <?php
          namespace H2O\Site_Migrator;

          if ( ! defined( 'ABSPATH' ) ) {
              exit;
          }

          /**
           * Templa's Salient theme bootstrap.
           *
           * This is intentionally site-local theme setup, not component integration.
           * It configures the active Salient theme and WordPress core navigation only.
           */
          final class Salient_Setup {
              private const LOGO_URL = 'https://templadesign.cl/wp-content/uploads/2025/04/TEMPLA_BLACKsm.png';

              public static function register(): void {
                  add_action( 'init', array( self::class, 'maybe_configure' ), 100 );
              }

              public static function maybe_configure(): void {
                  $profile = Registry::current_profile();
                  if ( ! is_array( $profile ) || 'templa-design' !== (string) ( $profile['key'] ?? '' ) ) {
                      return;
                  }
                  self::configure();
              }

              public static function configure(): void {
                  self::configure_header_navigation();
                  self::configure_primary_menu();
              }

              private static function logo_media(): array {
                  $url = self::LOGO_URL;
                  $id = (int) attachment_url_to_postid( $url );
                  $width = 0;
                  $height = 0;

                  if ( $id > 0 ) {
                      $src = wp_get_attachment_image_src( $id, 'full' );
                      if ( is_array( $src ) ) {
                          $url = (string) $src[0];
                          $width = (int) $src[1];
                          $height = (int) $src[2];
                      }
                  }

                  return array(
                      'url'       => esc_url_raw( $url ),
                      'id'        => $id,
                      'height'    => $height,
                      'width'     => $width,
                      'thumbnail' => esc_url_raw( $url ),
                  );
              }

              private static function configure_header_navigation(): void {
                  $options = get_option( 'salient_redux', array() );
                  $options = is_array( $options ) ? $options : array();
                  $logo = self::logo_media();

                  // Redux "media" fields are arrays. A bare URL does not populate
                  // Header Navigation -> Logo Upload in Salient.
                  $options['use-logo'] = '1';
                  $options['logo'] = $logo;
                  $options['mobile-logo'] = $logo;

                  // Native Salient header options -> native data-* attributes.
                  $options['logo-height'] = '42';
                  $options['mobile-logo-height'] = '30';
                  $options['header-padding'] = '18';
                  $options['header_format'] = 'default';
                  $options['header-fullwidth'] = '0';
                  $options['header-color'] = 'light';
                  $options['header-background-color'] = '#ffffff';
                  $options['header-disable-search'] = '1';
                  $options['transparent-header'] = '0';
                  $options['header-mobile-fixed'] = '1';
                  $options['header-remove-fixed'] = '0';
                  $options['header-resize-on-scroll'] = '1';
                  $options['header-hover-effect'] = 'default';
                  $options['header-box-shadow'] = 'small';

                  update_option( 'salient_redux', $options, false );
              }

              private static function configure_primary_menu(): void {
                  $menu = false;

                  foreach ( array( 'Principal', 'Main', 'Main Menu', 'Templa Principal', 'Top Navigation Menu' ) as $name ) {
                      $candidate = wp_get_nav_menu_object( $name );
                      if ( $candidate ) {
                          $menu = $candidate;
                          break;
                      }
                  }

                  if ( ! $menu ) {
                      $menu_id = wp_create_nav_menu( 'Principal' );
                      if ( is_wp_error( $menu_id ) ) {
                          return;
                      }
                      $menu = wp_get_nav_menu_object( (int) $menu_id );
                  }

                  if ( ! $menu ) {
                      return;
                  }

                  $menu_id = (int) $menu->term_id;
                  $existing = wp_get_nav_menu_items( $menu_id );
                  $existing = is_array( $existing ) ? $existing : array();
                  $by_page = array();

                  foreach ( $existing as $item ) {
                      if ( 'page' === (string) ( $item->object ?? '' ) ) {
                          $by_page[ (int) $item->object_id ] = (int) $item->ID;
                      }
                  }

                  $wanted = array(
                      array( 'slug' => 'inicio', 'label' => 'Inicio' ),
                      array( 'slug' => 'quienes-somos', 'label' => 'Quiénes somos' ),
                      array( 'slug' => 'servicios', 'label' => 'Servicios' ),
                      array( 'slug' => 'portafolio', 'label' => 'Portafolio' ),
                      array( 'slug' => 'blog', 'label' => 'Blog' ),
                      array( 'slug' => 'contacto', 'label' => 'Contacto' ),
                  );

                  $position = 1;
                  foreach ( $wanted as $entry ) {
                      $page = get_page_by_path( $entry['slug'], OBJECT, 'page' );
                      if ( ! $page instanceof \WP_Post ) {
                          $position++;
                          continue;
                      }

                      $item_id = $by_page[ (int) $page->ID ] ?? 0;
                      $saved = wp_update_nav_menu_item(
                          $menu_id,
                          $item_id,
                          array(
                              'menu-item-title'     => $entry['label'],
                              'menu-item-object-id' => (int) $page->ID,
                              'menu-item-object'    => 'page',
                              'menu-item-type'      => 'post_type',
                              'menu-item-status'    => 'publish',
                              'menu-item-position'  => $position,
                          )
                      );
                      if ( ! is_wp_error( $saved ) ) {
                          $by_page[ (int) $page->ID ] = (int) $saved;
                      }
                      $position++;
                  }

                  // Salient's main header renders theme_location "top_nav".
                  // Assign unconditionally after the pages exist.
                  $locations = get_theme_mod( 'nav_menu_locations', array() );
                  $locations = is_array( $locations ) ? $locations : array();
                  $locations['top_nav'] = $menu_id;
                  set_theme_mod( 'nav_menu_locations', $locations );
              }
          }
          PHP

          python3 - "$ROOT" "$BASE_VERSION" "$VERSION" <<'PY'
          import pathlib, re, sys

          root = pathlib.Path(sys.argv[1])
          base = sys.argv[2]
          version = sys.argv[3]

          main = root / "h2o-ia-site-migrator.php"
          s = main.read_text()
          s = s.replace(f"Version: {base}", f"Version: {version}")
          s = s.replace(f"define( 'H2OSM_VERSION', '{base}' )", f"define( 'H2OSM_VERSION', '{version}' )")
          main.write_text(s)

          profile = root / "profiles/templa-design.php"
          p = profile.read_text()
          p = p.replace(f"h2o-site-migrator:templa-design:{base}", f"h2o-site-migrator:templa-design:{version}")
          p = p.replace(f'data-h2osm-release="{base}"', f'data-h2osm-release="{version}"')
          p = re.sub(r"'version'\s*=>\s*'[^']+'", f"'version' => '{version}'", p, count=1)

          # Never use generic WPBakery stretching together with Salient row types.
          p = re.sub(r'\s+full_width="stretch_row_content_no_spaces"', '', p)
          p = re.sub(r'\s+full_width="stretch_row"', '', p)

          # Remove legacy structural helper classes. Salient row attrs own layout.
          for cls in (
              'h2osm-fullbleed',
              'h2osm-bg-row',
          ):
              p = p.replace(' ' + cls, '')

          # Remove duplicate/unmatched closing builder tags, then require strict nesting.
          token_re = re.compile(r'\[(?P<close>/)?(?P<tag>vc_row|vc_column|vc_column_text)(?P<attrs>[^\]]*)\]')
          out = []
          stack = []
          pos = 0
          removed = []
          for m in token_re.finditer(p):
              out.append(p[pos:m.start()])
              tag = m.group('tag')
              closing = bool(m.group('close'))
              if not closing:
                  stack.append(tag)
                  out.append(m.group(0))
              else:
                  if stack and stack[-1] == tag:
                      stack.pop()
                      out.append(m.group(0))
                  elif tag not in stack:
                      removed.append(m.group(0))
                      # Safe duplicate closing: drop it.
                  else:
                      raise SystemExit(f'misnested builder shortcode: closing {tag} while stack={stack[-6:]}')
              pos = m.end()
          out.append(p[pos:])
          p = ''.join(out)
          if stack:
              raise SystemExit(f'unclosed builder shortcode stack={stack[-10:]}')

          # Remove truly empty rows/columns only.
          previous = None
          while previous != p:
              previous = p
              p = re.sub(r'\[vc_row[^\]]*\]\s*\[vc_column[^\]]*\]\s*\[/vc_column\]\s*\[/vc_row\]', '', p, flags=re.S)
              p = re.sub(r'\[vc_row[^\]]*\]\s*\[/vc_row\]', '', p, flags=re.S)

          profile.write_text(p)

          css = root / "assets/frontend.css"
          c = css.read_text()

          # No row geometry/background ownership in plugin CSS. Salient owns rows.
          forbidden_selector_tokens = (
              '.h2osm-fullbleed',
              '.h2osm-hero-row',
              '.h2osm-visual-row',
              '.h2osm-bg-row',
              '.h2osm-site>.h2osm-section',
              '.h2osm-site > .h2osm-section',
              '.h2osm-site>.h2osm-service-grid',
              '.h2osm-site > .h2osm-service-grid',
              '.h2osm-site>.h2osm-project-grid',
              '.h2osm-site > .h2osm-project-grid',
              '.row_col_wrap_12',
          )

          pieces = []
          pos = 0
          for m in re.finditer(r'([^{}]+)\{([^{}]*)\}', c, re.S):
              pieces.append(c[pos:m.start()])
              selector, body = m.group(1), m.group(2)
              if any(t in selector for t in forbidden_selector_tokens):
                  pieces.append('')
              else:
                  # Strip only structural declarations from all remaining helper rules.
                  body = re.sub(r'(?i)(?:width|max-width|min-width|margin-left|margin-right|left|right)\s*:\s*[^;{}]+;?', '', body)
                  body = re.sub(r'(?i)background(?:-color|-image|-position|-size|-repeat)?\s*:\s*[^;{}]+;?', '', body)
                  pieces.append(selector + '{' + body + '}')
              pos = m.end()
          pieces.append(c[pos:])
          c = ''.join(pieces)

          # Absolute guard rails against the earlier hacks.
          c = re.sub(r'(?i)100vw', '', c)
          c = re.sub(r'(?i)calc\([^)]*50vw[^)]*\)', '', c)
          css.write_text(c)
          PY

          # Add runtime safety before any page is overwritten.
          python3 - "$ROOT" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          sync = root / 'includes/class-sync.php'
          s = sync.read_text()
          needle = "            'post_content' => (string) ( $page['content'] ?? '' ),"
          replacement = """            'post_content' => self::validated_builder_content( (string) ( $page['content'] ?? '' ) ),"""
          if needle in s:
              s = s.replace(needle, replacement)

          insert_before = "\n    private static function existing_managed_page"
          method = r'''
    private static function validated_builder_content( string $content ): string {
        $content = preg_replace(
            '/\[vc_row[^\]]*\]\s*\[vc_column[^\]]*\]\s*\[\/vc_column\]\s*\[\/vc_row\]/s',
            '',
            $content
        );
        $content = preg_replace(
            '/\[vc_row[^\]]*\]\s*\[\/vc_row\]/s',
            '',
            (string) $content
        );

        $pattern = '/\[(\/)?(vc_row|vc_column|vc_column_text)(?:\s[^\]]*)?\]/';
        preg_match_all( $pattern, (string) $content, $matches, PREG_SET_ORDER );
        $stack = array();

        foreach ( $matches as $match ) {
            $closing = ! empty( $match[1] );
            $tag = (string) $match[2];
            if ( ! $closing ) {
                $stack[] = $tag;
                continue;
            }

            $last = end( $stack );
            if ( $last !== $tag ) {
                throw new \RuntimeException( 'Builder Salient inválido: cierre ' . $tag . ' fuera de orden.' );
            }
            array_pop( $stack );
        }

        if ( ! empty( $stack ) ) {
            throw new \RuntimeException( 'Builder Salient inválido: existen shortcodes sin cerrar.' );
        }

        if ( preg_match( '/\[\/vc_column_text\]/', strip_shortcodes( (string) $content ) ) ) {
            throw new \RuntimeException( 'Builder Salient inválido: shortcode residual visible.' );
        }

        return (string) $content;
    }
'''
          if 'validated_builder_content' not in s:
              s = s.replace(insert_before, "\n" + method + insert_before)
          sync.write_text(s)
          PY

          {
            echo "## $VERSION — 2026-10-05"
            echo "- Corrige el Logo Upload de Header Navigation usando el formato Redux media real (url/id/width/height/thumbnail)."
            echo "- Asigna el menú Principal a top_nav sin depender de que la ubicación ya esté registrada en ese instante."
            echo "- Elimina cierres duplicados de vc_column_text y bloquea sincronizaciones con nesting inválido."
            echo "- Elimina filas vacías reales."
            echo "- Retira del CSS del plugin cualquier control de geometría o fondo de Rows; esos valores quedan exclusivamente en atributos nativos de Salient."
            echo "- Mantiene Funnels por HTTP público y el resto de la migración."
            echo
            cat "$ROOT/CHANGELOG.md"
          } > "$WORK/CHANGELOG.md"
          mv "$WORK/CHANGELOG.md" "$ROOT/CHANGELOG.md"

          php -l "$ROOT/h2o-ia-site-migrator.php" >/dev/null
          php -l "$ROOT/includes/class-sync.php" >/dev/null
          php -l "$ROOT/includes/class-salient-setup.php" >/dev/null
          php -l "$ROOT/profiles/templa-design.php" >/dev/null

          grep -q "Version: $VERSION" "$ROOT/h2o-ia-site-migrator.php"
          grep -q "'thumbnail' => esc_url_raw" "$ROOT/includes/class-salient-setup.php"
          grep -q "\['top_nav'\] = \$menu_id" "$ROOT/includes/class-salient-setup.php"
          grep -q "validated_builder_content" "$ROOT/includes/class-sync.php"
          ! grep -q 'full_width="stretch_row' "$ROOT/profiles/templa-design.php"
          ! grep -q 'width:100vw' "$ROOT/assets/frontend.css"
          ! grep -q 'row_col_wrap_12' "$ROOT/assets/frontend.css"

          python3 - "$ROOT/profiles/templa-design.php" <<'PY'
          import re, pathlib, sys
          s = pathlib.Path(sys.argv[1]).read_text()

          # Strict stack balance.
          token_re = re.compile(r'\[(?P<close>/)?(?P<tag>vc_row|vc_column|vc_column_text)(?:[^\]]*)\]')
          stack = []
          for m in token_re.finditer(s):
              tag = m.group('tag')
              if not m.group('close'):
                  stack.append(tag)
              else:
                  if not stack or stack[-1] != tag:
                      raise SystemExit(f'BAD_NESTING {tag} stack={stack[-8:]}')
                  stack.pop()
          if stack:
              raise SystemExit(f'UNCLOSED {stack[-8:]}')

          # No empty rows.
          for row in re.findall(r'\[vc_row[^\]]*\].*?\[/vc_row\]', s, re.S):
              inner = re.sub(r'\[/?vc_column[^\]]*\]|\[/?vc_column_text[^\]]*\]|\[/?vc_row[^\]]*\]', '', row)
              inner = re.sub(r'<!--.*?-->', '', inner, flags=re.S).strip()
              if not re.sub(r'\s+', '', inner):
                  raise SystemExit('EMPTY_ROW')

          # No inline style blocks in Builder content.
          if '<style' in s.lower():
              raise SystemExit('INLINE_STYLE_BLOCK_FOUND')

          print('STRICT_SALIENT_PROFILE_OK')
          PY

          (cd "$WORK/current" && zip -qr "$DIST/h2o-ia-site-migrator-$VERSION.zip" h2o-ia-site-migrator)
          SHA="$(sha256sum "$DIST/h2o-ia-site-migrator-$VERSION.zip" | awk '{print $1}')"
          echo "$SHA" > "$DIST/package.sha256"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          base64 -w0 "$DIST/h2o-ia-site-migrator-$VERSION.zip" > "$DIST/package.b64"
          split -b 5000 -d -a 2 "$DIST/package.b64" "$DIST/parts/raw-"

          node - "$VERSION" "$SHA" <<'NODE'
          const fs = require('fs');
          const [version, sha] = process.argv.slice(2);
          const raw = fs.readdirSync('dist/parts').sort();
          const parts = raw.map((f,i) =>
            'https://raw.githubusercontent.com/h2ostudiochile/h2o-ia-site-migrator/main/bootstrap/' +
            version + '/part-' + String(i + 1).padStart(2,'0') + '.b64'
          );
          fs.writeFileSync('dist/release-bootstrap.json', JSON.stringify({
            version,
            package_id: 'https://raw.githubusercontent.com/h2ostudiochile/h2o-ia-site-migrator/main/bootstrap/package.sha256',
            package_sha256: sha,
            parts,
            tested: '7.1',
            requires_php: '8.0'
          }, null, 2) + '\n');
          fs.writeFileSync('dist/release.json', JSON.stringify({
            version,
            package_url: 'https://github.com/h2ostudiochile/h2o-ia-site-migrator/releases/download/v' + version + '/h2o-ia-site-migrator-' + version + '.zip',
            package_sha256: sha,
            tested: '7.1',
            requires_php: '8.0'
          }, null, 2) + '\n');
          NODE

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          PACKAGE="dist/h2o-ia-site-migrator-$VERSION.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" dist/release.json --clobber
          else
            gh release create "$TAG" "$PACKAGE" dist/release.json \
              --target main \
              --title "h2o IA Site Migrator $VERSION" \
              --notes "Corrección estricta Salient: logo Redux media real, menú Principal en top_nav, nesting de shortcodes validado, filas vacías eliminadas y cero CSS del plugin gobernando geometría/fondos de Rows."
          fi

      - name: Publish updater chunks and manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"

          put_file () {
            path="$1"
            file="$2"
            msg="$3"
            encoded="$(base64 -w0 "$file")"
            sha="$(gh api "repos/$REPO/contents/$path?ref=main" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              gh api --method PUT "repos/$REPO/contents/$path" \
                -f message="$msg" -f content="$encoded" -f sha="$sha" -f branch="main" >/dev/null
            else
              gh api --method PUT "repos/$REPO/contents/$path" \
                -f message="$msg" -f content="$encoded" -f branch="main" >/dev/null
            fi
          }

          i=1
          for f in $(find dist/parts -type f -name 'raw-*' | sort); do
            target="$(printf 'bootstrap/%s/part-%02d.b64' "$VERSION" "$i")"
            put_file "$target" "$f" "Site Migrator $VERSION package part $i"
            i=$((i+1))
          done

          put_file "bootstrap/package.sha256" "dist/package.sha256" "Site Migrator $VERSION checksum"
          put_file "bootstrap/release.json" "dist/release-bootstrap.json" "Publish Site Migrator $VERSION updater manifest"
